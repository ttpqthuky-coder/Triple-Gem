const EXTRA = ["homage||pay homage to = bày tỏ lòng tôn kính với; in homage to = để tỏ lòng tôn kính, tưởng nhớ|The film is a homage to the great directors of the 1950s.|Bộ phim là lời tri ân dành cho các đạo diễn lớn thập niên 1950.|Every morning the monks pay homage to the Buddha with incense and flowers.|Mỗi sáng các nhà sư đảnh lễ Đức Phật bằng hương và hoa.|Gốc Pháp \"homme\" (con người): xưa chư hầu quỳ thề làm \"người của\" lãnh chúa, nên homage mang nghĩa sự tôn kính. Hay đi với động từ pay: pay homage to.", "devoted|devote (v.) cống hiến; devotion (n.) sự tận tụy; devotee (n.) tín đồ; devotedly (adv.) một cách tận tụy|devoted to sb/sth = tận tụy với; a devoted fan/follower = người hâm mộ, tín đồ trung thành|He is a devoted father who never misses his daughter's school concerts.|Anh ấy là người cha tận tụy, không bao giờ bỏ lỡ buổi hòa nhạc ở trường của con gái.|The old nun has been devoted to the temple for over fifty years.|Vị ni sư già đã tận tụy với ngôi chùa hơn năm mươi năm.|devote + -ed tạo tính từ \"được dâng hiến, tận tụy\". Luôn đi với giới từ to: devoted to + danh từ hoặc V-ing.", "revered|revere (v.) tôn kính; reverence (n.) sự tôn kính; reverend (n.) đức cha, vị đáng kính|widely revered = được nhiều người tôn kính; revered as = được tôn kính như là|Nelson Mandela is revered as a hero all over the world.|Nelson Mandela được tôn kính như một người anh hùng trên khắp thế giới.|The Dalai Lama is revered by millions of Buddhists.|Đức Đạt-lai Lạt-ma được hàng triệu Phật tử tôn kính.|Cùng họ với reverence. \"Revere\" mạnh hơn \"respect\": kính trọng kèm lòng ngưỡng mộ gần như thiêng liêng.", "bestow|bestowal (n.) sự ban tặng|bestow sth on/upon sb = ban, trao tặng cái gì cho ai; bestow an honour/a title = trao vinh dự/danh hiệu|The king will bestow a special title on the brave soldier.|Nhà vua sẽ ban một tước hiệu đặc biệt cho người lính dũng cảm.|The abbot came out to bestow his blessing on the new monks.|Sư trụ trì bước ra ban lời chúc phúc cho các tân tăng.|be- + stow (đặt, cất): \"đặt lên\" ai đó một món quà hay vinh dự. Từ trang trọng, cấu trúc: bestow sth ON sb.", "entrusted|entrust (v.) giao phó; trust (n./v.) lòng tin; trustworthiness (n.) sự đáng tin cậy|be entrusted with sth = được giao phó việc gì; entrust sth to sb = giao phó cái gì cho ai|The children were entrusted to their grandparents while their parents worked abroad.|Bọn trẻ được gửi gắm cho ông bà trong khi bố mẹ làm việc ở nước ngoài.|The young monk was entrusted with looking after the old sutras.|Chú tiểu được giao phó việc trông coi những bộ kinh cổ.|en- (đặt vào) + trust (lòng tin) = đặt lòng tin vào ai, tức là giao phó. Hai cấu trúc: entrust sb WITH sth / entrust sth TO sb.", "sacred|sacredness (n.) sự thiêng liêng; sacrifice (n./v.) hy sinh (cùng gốc sacr- \"thiêng\")|sacred place/site = nơi linh thiêng; sacred text = kinh văn thiêng liêng; hold sth sacred = coi điều gì là thiêng liêng|For her, family time on Sunday is sacred.|Với cô ấy, thời gian dành cho gia đình ngày Chủ nhật là điều thiêng liêng.|Monks copy the sacred texts by hand with great care.|Các nhà sư chép tay kinh văn thiêng liêng hết sức cẩn thận.|Gốc Latin sacr- nghĩa là thiêng liêng, cũng có trong sacrifice (\"làm cho thành thiêng\", tức hy sinh). Đọc /ˈseɪ-/ như \"say\".", "reverence|revere (v.) tôn kính; revered (adj.) được tôn kính; reverent (adj.) cung kính|with reverence = một cách cung kính; deep reverence for = lòng tôn kính sâu sắc với; show reverence = tỏ lòng tôn kính|The old soldiers spoke of their fallen friends with reverence.|Các cựu binh nói về những đồng đội đã hy sinh với lòng tôn kính.|Remove your shoes before entering the hall as a sign of reverence.|Hãy cởi giày trước khi vào chánh điện để tỏ lòng tôn kính.|revere (tôn kính) + -ence (hậu tố danh từ). Cặp dễ nhớ: revered là tính từ, reverence là danh từ.", "earnestly|earnest (adj.) nghiêm túc, tha thiết; earnestness (n.) sự tha thiết|earnestly hope/pray/ask = tha thiết mong/cầu/xin; speak earnestly = nói một cách nghiêm túc|She looked at me earnestly and asked for my honest opinion.|Cô ấy nhìn tôi nghiêm túc và hỏi ý kiến thật lòng của tôi.|The pilgrims earnestly recited the Heart Sutra together.|Những người hành hương cùng nhau thành khẩn tụng Bát-nhã Tâm Kinh.|earnest + -ly tạo trạng từ. Thành ngữ \"in earnest\" nghĩa là nghiêm túc, thật sự (It started to rain in earnest).", "compassionately|compassion (n.) lòng từ bi; compassionate (adj.) từ bi, thương cảm|act/speak/listen compassionately = hành động/nói/lắng nghe với lòng từ bi|Good doctors listen compassionately to their patients' worries.|Bác sĩ giỏi lắng nghe nỗi lo của bệnh nhân với lòng cảm thông.|The Bodhisattva looks compassionately on all who suffer.|Bồ-tát nhìn tất cả những ai đang khổ đau bằng ánh mắt từ bi.|com- (cùng) + passion (chịu đựng, cảm xúc) = \"cùng chịu khổ với người khác\". Chuỗi: compassion → compassionate → compassionately.", "boundless|bound (n.) giới hạn; boundary (n.) ranh giới; boundlessly (adv.) vô hạn|boundless energy/love/joy = năng lượng/tình yêu/niềm vui vô hạn|Young children seem to have boundless energy.|Trẻ nhỏ dường như có năng lượng vô tận.|Buddhist texts speak of the boundless compassion of the Buddha.|Kinh Phật nói về lòng từ bi vô lượng của Đức Phật.|bound (ranh giới, như boundary) + -less (không có) = không có ranh giới. Cùng nhóm \"vô hạn\": endless, infinite, immeasurable.", "purify|pure (adj.) trong sạch; purity (n.) sự thanh khiết; purification (n.) sự thanh lọc|purify water/air = lọc nước/không khí; purify the mind/heart = thanh lọc tâm|This machine can purify the air in a small room.|Chiếc máy này có thể lọc không khí trong một căn phòng nhỏ.|Monks believe that keeping the precepts helps to purify the heart.|Các nhà sư tin rằng giữ giới giúp thanh lọc tâm hồn.|pure (trong sạch) + -ify (làm cho) = làm cho trong sạch. Hậu tố -ify giống trong simplify, beautify.", "misdeeds|deed (n.) việc làm; misdeed (n.) việc làm sai trái (số ít)|past misdeeds = những việc làm sai trái trong quá khứ; confess/punish misdeeds = thú nhận/trừng phạt hành vi sai trái|The politician apologised publicly for his misdeeds.|Chính trị gia công khai xin lỗi vì những việc làm sai trái của mình.|Through repentance, we can let go of the weight of past misdeeds.|Nhờ sám hối, ta có thể buông bỏ gánh nặng của những lỗi lầm xưa.|mis- (sai) + deed (việc làm) = việc làm sai. Cùng tiền tố mis- với misappropriate.", "wholesome|wholesomeness (n.) sự lành mạnh; whole (adj.) toàn vẹn|wholesome food = thức ăn bổ dưỡng; wholesome entertainment = giải trí lành mạnh; wholesome deeds = việc thiện|It's a wholesome family film that children and parents can enjoy together.|Đó là một bộ phim gia đình lành mạnh mà trẻ em và cha mẹ cùng xem được.|In Buddhism, wholesome actions lead to happiness, and unwholesome ones lead to suffering.|Trong đạo Phật, hành động thiện dẫn đến hạnh phúc, hành động bất thiện dẫn đến khổ đau.|whole (toàn vẹn) + -some (mang tính chất): giúp con người toàn vẹn, khỏe mạnh. Trong kinh Phật tiếng Anh, wholesome là thiện, unwholesome là bất thiện.", "merit|meritorious (adj.) đáng khen, có công đức; merit (v.) xứng đáng|make/gain merit = tạo/tích công đức; on merit = dựa trên năng lực; dedicate merit = hồi hướng công đức|Students are chosen for the scholarship on merit, not money.|Sinh viên được chọn nhận học bổng dựa trên năng lực, không phải tiền bạc.|After the ceremony, we dedicate the merit to all living beings.|Sau buổi lễ, chúng ta hồi hướng công đức đến tất cả chúng sinh.|Nghĩa đời thường: giá trị, ưu điểm (the merits of a plan). Nghĩa Phật học: công đức. \"Hồi hướng công đức\" là dedicate merit.", "virtuous|virtue (n.) đức tính; virtues (n.) các đức tính; virtuously (adv.) một cách đức hạnh|a virtuous life = đời sống đức hạnh; a virtuous circle = vòng tròn tích cực|Regular exercise and good sleep create a virtuous circle.|Tập thể dục đều và ngủ ngon tạo thành một vòng tròn tích cực.|The sutras describe the virtuous qualities of a good friend on the path.|Kinh điển mô tả những phẩm chất đức hạnh của một thiện tri thức trên đường tu.|virtue (đức tính) + -ous (đầy) = đầy đức tính. Đọc /ˈvɜː.tʃu.əs/, âm \"tʃ\" như \"ch\".", "Bodhicitta|bodhi (n.) giác ngộ; Bodhisattva (n.) Bồ-tát|arouse/generate Bodhicitta = phát tâm Bồ-đề; cultivate Bodhicitta = nuôi dưỡng tâm Bồ-đề|The retreat teaches people how to arouse Bodhicitta in daily life.|Khóa tu dạy mọi người cách phát tâm Bồ-đề trong đời sống hằng ngày.|Without Bodhicitta, even great learning cannot lead to Buddhahood.|Không có tâm Bồ-đề, dù học rộng cũng không thể thành Phật.|Tiếng Phạn: bodhi (giác ngộ) + citta (tâm) = tâm giác ngộ. \"Phát tâm Bồ-đề\" dịch là arouse Bodhicitta.", "diligent|diligence (n.) sự siêng năng, tinh tấn; diligently (adv.) một cách siêng năng|diligent student/worker = học sinh/người làm siêng năng; diligent in (doing) sth = chăm chỉ làm gì|She is very diligent in checking every detail of her work.|Cô rất chăm chỉ kiểm tra từng chi tiết trong công việc.|The Buddha's last advice was to be diligent on the path to liberation.|Lời khuyên cuối cùng của Đức Phật là hãy tinh tấn trên con đường giải thoát.|Phật học dùng diligence cho \"tinh tấn\". Gần nghĩa hardworking nhưng trang trọng hơn và nhấn vào sự cẩn thận, bền bỉ.", "cultivation|cultivate (v.) tu tập, trồng trọt; cultivated (adj.) có học thức|rice cultivation = trồng lúa; spiritual cultivation = tu tập tâm linh; the cultivation of mindfulness = việc tu tập chánh niệm|Rice cultivation needs a lot of water.|Trồng lúa cần rất nhiều nước.|Daily meditation is a key part of spiritual cultivation.|Thiền mỗi ngày là phần cốt lõi của việc tu tập tâm linh.|cultivate + -tion. Gốc Latin cultus là cày cấy (như culture, agriculture). Tu tập giống trồng cây: gieo hạt, chăm bón, chờ trổ hoa.", "meditative|meditate (v.) thiền; meditation (n.) thiền định; meditator (n.) người hành thiền|a meditative state/mood = trạng thái/tâm trạng tĩnh lặng; meditative music = nhạc thiền|Gardening can be a very meditative activity.|Làm vườn có thể là một hoạt động rất tĩnh tâm.|The slow sound of the temple bell put everyone in a meditative state.|Tiếng chuông chùa chậm rãi đưa mọi người vào trạng thái thiền định.|meditate + -ive (tính từ). Cả họ: meditate (v.) → meditation (n.) → meditative (adj.).", "ecstasy|ecstatic (adj.) ngây ngất|in ecstasy = trong trạng thái ngây ngất; pure ecstasy = sự sung sướng tột độ|The fans screamed in ecstasy when their team scored.|Người hâm mộ hét lên sung sướng khi đội nhà ghi bàn.|Some meditators describe deep concentration as a joy close to ecstasy.|Một số thiền giả mô tả định sâu như một niềm hỷ lạc gần như ngây ngất.|Gốc Hy Lạp ek- (ra ngoài) + stasis (đứng) = \"đứng ra ngoài chính mình\", tức xuất thần. Chính tả: ecSTaSy, không phải \"ecstacy\".", "enlightenment|enlighten (v.) khai sáng; enlightened (adj.) đã giác ngộ, sáng suốt|attain/reach enlightenment = đạt giác ngộ; the path to enlightenment = con đường giác ngộ; the Age of Enlightenment = Thời kỳ Khai sáng|The 18th century in Europe is known as the Age of Enlightenment.|Thế kỷ 18 ở châu Âu được gọi là Thời kỳ Khai sáng.|For Zen masters, enlightenment can come in a single moment of clear seeing.|Với các thiền sư, giác ngộ có thể đến trong một khoảnh khắc thấy rõ.|en- (làm cho) + light (ánh sáng) + -ment (danh từ) = được làm cho sáng ra. Đi với attain hoặc reach.", "radiating|radiate (v.) tỏa ra; radiant (adj.) rạng rỡ; radiance (n.) ánh sáng rạng rỡ; radiation (n.) bức xạ|radiating warmth/joy/confidence = tỏa ra sự ấm áp/niềm vui/sự tự tin; radiating from = tỏa ra từ|Heat was radiating from the old stove in the corner.|Hơi nóng tỏa ra từ chiếc bếp cũ trong góc.|In the painting, golden light is radiating from the Buddha's body.|Trong bức tranh, ánh sáng vàng đang tỏa ra từ thân Đức Phật.|Gốc radius (tia, bán kính): ánh sáng tỏa ra như các tia từ tâm. Cùng họ: radiance, radiant.", "halo|halos (n.) số nhiều|a halo around sb's head = vầng hào quang quanh đầu; the halo effect = hiệu ứng hào quang|On cold nights, you can sometimes see a halo around the moon.|Những đêm lạnh đôi khi bạn có thể thấy quầng sáng quanh mặt trăng.|The statue's halo was painted gold by the villagers.|Vầng hào quang của pho tượng được dân làng sơn màu vàng.|\"Halo effect\" là thuật ngữ tâm lý: thấy một điểm tốt ở ai đó rồi nghĩ mọi thứ của họ đều tốt. Đọc /ˈheɪ.ləʊ/ như \"hây-lâu\".", "insight|insightful (adj.) sâu sắc|gain insight into = hiểu sâu về; insight meditation = thiền minh sát (Vipassana)|Travelling gave me new insight into other cultures.|Du lịch cho tôi hiểu biết mới về các nền văn hóa khác.|Insight meditation, or Vipassana, trains us to see things as they really are.|Thiền minh sát (Vipassana) rèn cho ta thấy sự vật đúng như thật.|in (vào trong) + sight (sự nhìn) = nhìn vào bên trong. Giới từ: insight INTO sth.", "kowtow||kowtow to sb = khúm núm, quỵ lụy ai (nghĩa bóng)|He refuses to kowtow to his rich customers.|Anh ấy không chịu khúm núm trước những khách hàng giàu có.|At the village pagoda, the old woman knelt down to kowtow before the altar.|Ở chùa làng, bà cụ quỳ xuống khấu đầu trước bàn thờ.|Mượn từ tiếng Hán \"khấu đầu\" (叩頭). Tiếng Anh hiện đại hay dùng nghĩa bóng, chê ai đó quỵ lụy: kowtow TO sb.", "endless|end (n./v.) kết thúc; endlessly (adv.) không ngừng|endless possibilities = vô vàn khả năng; an endless list/queue = danh sách/hàng dài bất tận|The meeting felt endless, and everyone was tired.|Cuộc họp như kéo dài bất tận, ai cũng mệt mỏi.|Desire is endless: when one wish is satisfied, another appears.|Lòng tham là vô tận: một ước muốn được thỏa mãn thì ước muốn khác lại xuất hiện.|end (kết thúc) + -less (không có) = không có kết thúc. Nhóm -less: boundless, countless, fearless, numberless, selfless.", "entrust|entrusted (v-ed) được giao phó; trust (n./v.) lòng tin; trustworthiness (n.) sự đáng tin cậy|entrust sb with sth = giao cho ai việc gì; entrust sth to sb = giao phó cái gì cho ai|Would you entrust your savings to a bank you have never heard of?|Bạn có giao tiền tiết kiệm cho một ngân hàng chưa từng nghe tên không?|Before he died, the master chose to entrust the temple to his best student.|Trước khi viên tịch, vị thầy chọn giao phó ngôi chùa cho người đệ tử giỏi nhất.|Mẹo: EN-TRUST là đặt TRUST (lòng tin) vào ai. Xem thêm entrusted.", "wholeheartedly|wholehearted (adj.) hết lòng; half-hearted (adj.) nửa vời (trái nghĩa)|agree/support wholeheartedly = hoàn toàn đồng ý/ủng hộ hết lòng|I wholeheartedly agree with your plan.|Tôi hoàn toàn đồng ý với kế hoạch của bạn.|When you chant, do it wholeheartedly, not just with your lips.|Khi tụng kinh, hãy tụng hết lòng, đừng chỉ đọc ngoài miệng.|whole (toàn bộ) + heart (trái tim) + -ed + -ly = với toàn bộ trái tim. Trái nghĩa: half-heartedly (nửa vời).", "transcended|transcend (v.) vượt lên; transcendent (adj.) siêu việt; transcendence (n.) sự siêu việt|transcend boundaries/differences = vượt qua ranh giới/khác biệt; transcend the self = vượt lên bản ngã|Their friendship transcended age and nationality.|Tình bạn của họ vượt qua tuổi tác và quốc tịch.|The Buddha transcended birth and death.|Đức Phật đã vượt thoát sinh tử.|trans- (băng qua) + scend (leo, như ascend) = leo vượt lên trên. Mạnh hơn overcome: không chỉ thắng mà còn vượt hẳn lên trên.", "samsara|samsaric (adj.) thuộc luân hồi; nirvana (n.) Niết-bàn (đối lập)|the wheel of samsara = bánh xe luân hồi; trapped in samsara = mắc kẹt trong luân hồi; be free from samsara = thoát khỏi luân hồi|The novel uses samsara as a symbol of people repeating the same mistakes.|Cuốn tiểu thuyết dùng luân hồi làm biểu tượng cho việc con người lặp lại cùng sai lầm.|Ignorance and craving keep beings turning in samsara.|Vô minh và ái dục khiến chúng sinh xoay vần trong luân hồi.|Tiếng Phạn saṃsāra nghĩa là \"trôi lăn liên tục\". Đối lập với nirvana (Niết-bàn).", "countless|count (v.) đếm; countable (adj.) đếm được; uncountable (adj.) không đếm được|countless times = vô số lần; countless people/stars = vô số người/vì sao|Countless volunteers helped clean the beach after the storm.|Vô số tình nguyện viên đã giúp dọn bãi biển sau cơn bão.|The sutra says there are countless Buddhas in countless worlds.|Kinh nói có vô số chư Phật trong vô số thế giới.|count (đếm) + -less = không đếm xuể. Phân biệt: uncountable dùng trong ngữ pháp (danh từ không đếm được); countless nghĩa là rất nhiều.", "immeasurable|measure (v./n.) đo; measurable (adj.) đo được; immeasurably (adv.) vô cùng|of immeasurable value = có giá trị vô lượng; the Four Immeasurables = Tứ vô lượng tâm (từ, bi, hỷ, xả)|Her help was of immeasurable value to our small team.|Sự giúp đỡ của cô có giá trị vô cùng to lớn với nhóm nhỏ của chúng tôi.|Buddhists practise a loving-kindness that is immeasurable, reaching every being.|Phật tử thực tập lòng từ vô lượng, trải đến mọi chúng sinh.|im- (không) + measure (đo) + -able (có thể) = không thể đo. Tứ vô lượng tâm là the Four Immeasurables.", "compassion|compassionate (adj.) từ bi; compassionately (adv.) một cách từ bi|show/feel compassion for = thể hiện/cảm thấy lòng trắc ẩn với; out of compassion = vì lòng từ bi; great compassion = đại bi|The judge showed compassion and gave the young man a second chance.|Thẩm phán tỏ lòng trắc ẩn và cho chàng trai một cơ hội thứ hai.|Avalokiteshvara is the Bodhisattva of great compassion.|Quán Thế Âm là vị Bồ-tát đại bi.|com- (cùng) + passion (chịu đựng) = cùng chịu khổ. Từ (loving-kindness) là mang vui; bi (compassion) là cứu khổ.", "sentient|sentience (n.) khả năng cảm nhận; sense (n.) giác quan; sentiment (n.) tình cảm|sentient beings = chúng sinh (hữu tình); all sentient beings = tất cả chúng sinh|Some scientists argue that octopuses are highly sentient animals.|Một số nhà khoa học cho rằng bạch tuộc là loài có tri giác rất cao.|May all sentient beings be free from suffering.|Nguyện cho tất cả chúng sinh thoát khỏi khổ đau.|Gốc Latin sentire là cảm nhận (như sense, sentiment). \"Chúng sinh\" trong kinh tiếng Anh hầu như luôn là sentient beings. Đọc /ˈsen.ʃənt/.", "dedicated|dedicate (v.) cống hiến, đề tặng; dedication (n.) sự tận tâm|dedicated to (doing) sth = tận tâm với; be dedicated to sb = được đề tặng cho ai; a dedicated team = nhóm làm việc tận tâm|This book is dedicated to my parents.|Cuốn sách này xin được đề tặng cha mẹ tôi.|The new hall is dedicated to Avalokiteshvara Bodhisattva.|Ngôi điện mới được dâng lên Bồ-tát Quán Thế Âm.|Gần nghĩa devoted. dedicated còn nghĩa \"chuyên dụng\": a dedicated server. Luôn đi với TO + danh từ hoặc V-ing.", "meditation|meditate (v.) thiền; meditative (adj.) trầm tư; meditator (n.) người hành thiền|practise meditation = hành thiền; walking meditation = thiền hành; sitting meditation = thiền tọa; guided meditation = thiền có hướng dẫn|My company offers free meditation classes at lunchtime.|Công ty tôi có lớp thiền miễn phí vào giờ nghỉ trưa.|Walking meditation means paying attention to every step.|Thiền hành nghĩa là chú tâm vào từng bước chân.|Gốc Latin meditari là suy ngẫm. Cùng họ meditate, meditative. \"Hành thiền\" là practise meditation.", "merging|merge (v.) hợp nhất; merger (n.) vụ sáp nhập|merging traffic = dòng xe nhập làn; merging with/into = hòa vào|Be careful of merging traffic when you join the motorway.|Hãy cẩn thận với xe nhập làn khi bạn vào đường cao tốc.|In deep meditation, he felt his mind merging with the silence around him.|Trong thiền sâu, anh cảm thấy tâm mình hòa vào sự tĩnh lặng xung quanh.|merge + -ing. Danh từ merger hay dùng trong kinh doanh: a merger between two banks.", "essential|essence (n.) bản chất, tinh túy; essentially (adv.) về bản chất; essentials (n.) những thứ thiết yếu|essential for/to = thiết yếu cho; it is essential that = điều cốt yếu là; essential oils = tinh dầu|It is essential that you bring your passport to the airport.|Điều bắt buộc là bạn phải mang hộ chiếu ra sân bay.|Kindness is essential to Buddhist practice.|Lòng tốt là điều cốt yếu trong sự tu tập Phật giáo.|essence (tinh túy) + -ial: thuộc về cái cốt lõi. Mạnh hơn important: không có thì không được.", "virtues|virtue (n.) đức tính (số ít); virtuous (adj.) đức hạnh|by virtue of = nhờ vào, do; the virtues of sth = những ưu điểm của; patience is a virtue = kiên nhẫn là một đức tính tốt|One of the virtues of this phone is its long battery life.|Một ưu điểm của chiếc điện thoại này là pin dùng lâu.|Generosity, patience and wisdom are among the virtues a Bodhisattva perfects.|Bố thí, nhẫn nhục và trí tuệ nằm trong những đức hạnh mà Bồ-tát viên mãn.|Số ít virtue. Cụm \"by virtue of\" nghĩa là nhờ có (She got the job by virtue of her experience).", "accumulated|accumulate (v.) tích lũy; accumulation (n.) sự tích lũy|accumulated wealth/knowledge = của cải/kiến thức tích lũy; accumulated merit = công đức đã tích lũy|Dust had accumulated on the old books in the attic.|Bụi đã bám dày trên những cuốn sách cũ trên gác.|The monk said that accumulated merit is like money saved for a long journey.|Vị sư nói công đức tích lũy giống như tiền dành dụm cho một chuyến đi xa.|ac- (thêm vào) + cumul (đống, như mây tích cumulus) = chất thành đống. Chính tả: aCCumulated (2 chữ c, 1 chữ m).", "manifested|manifest (v./adj.) biểu hiện; rõ ràng; manifestation (n.) sự biểu hiện, hóa thân|manifested itself in/as = thể hiện ra dưới dạng; be manifested in = được biểu hiện trong|The illness first manifested itself as a mild headache.|Căn bệnh đầu tiên biểu hiện bằng một cơn đau đầu nhẹ.|Legend says the Bodhisattva manifested as a kind old woman to help travellers.|Truyền thuyết kể Bồ-tát đã hóa thân thành một bà lão hiền hậu để giúp người lữ hành.|manifest là làm cho thấy rõ. Trong Phật học, \"hóa thân, ứng hiện\" thường dịch là manifest. Cấu trúc hay gặp: manifest itself in sth.", "renouncing|renounce (v.) từ bỏ; renunciation (n.) sự xuất ly|renouncing the world = xả bỏ thế tục; renouncing violence = từ bỏ bạo lực|By renouncing violence, the group was allowed to join the peace talks.|Nhờ từ bỏ bạo lực, nhóm này được phép tham gia hòa đàm.|Renouncing worldly pleasures is not easy, but it brings deep peace.|Từ bỏ dục lạc thế gian không dễ, nhưng mang lại sự bình an sâu sắc.|Danh từ renunciation là \"xuất ly\" trong Phật học. Chú ý chính tả: renUNciation, chữ \"o\" biến mất.", "liberation|liberate (v.) giải phóng; liberty (n.) tự do|liberation from suffering = giải thoát khỏi khổ đau; national liberation = giải phóng dân tộc|The day of liberation was celebrated with music in the streets.|Ngày giải phóng được ăn mừng bằng âm nhạc trên đường phố.|Nirvana is complete liberation from greed, hatred and delusion.|Niết-bàn là sự giải thoát hoàn toàn khỏi tham, sân, si.|Gốc Latin liber là tự do (như liberty). liberate + -ion. Đi với from: liberation FROM sth.", "austere|austerity (n.) sự khắc khổ, thắt lưng buộc bụng; austerely (adv.) một cách khắc khổ|austere life = đời sống khắc khổ; austere room/style = căn phòng/phong cách đơn sơ|The hotel room was austere, with just a bed and a chair.|Phòng khách sạn rất đơn sơ, chỉ có một cái giường và một cái ghế.|Before his enlightenment, the Buddha tried extremely austere practices but found they did not work.|Trước khi giác ngộ, Đức Phật thử những pháp tu cực kỳ khổ hạnh nhưng thấy chúng không hiệu quả.|Trong kinh tế, austerity là chính sách thắt lưng buộc bụng. Đức Phật chọn Trung đạo, giữa dục lạc và khổ hạnh.", "supreme|supremacy (n.) quyền tối cao; supremely (adv.) cực kỳ|the Supreme Court = Tòa án Tối cao; supreme happiness = hạnh phúc tối thượng; reign supreme = chiếm ưu thế tuyệt đối|The Supreme Court will make the final decision.|Tòa án Tối cao sẽ đưa ra quyết định cuối cùng.|The sutras call Nirvana the supreme happiness.|Kinh gọi Niết-bàn là hạnh phúc tối thượng.|Gốc Latin supremus là cao nhất (super = trên). \"Vô thượng chánh đẳng chánh giác\" là supreme perfect enlightenment.", "ultimate|ultimately (adv.) cuối cùng; ultimatum (n.) tối hậu thư|ultimate goal/aim = mục tiêu cuối cùng; ultimate truth = chân lý tối hậu (chân đế); the ultimate test = thử thách cao nhất|Climbing Everest is the ultimate test for many climbers.|Leo Everest là thử thách lớn nhất đối với nhiều nhà leo núi.|Buddhism speaks of two truths: conventional truth and ultimate truth.|Đạo Phật nói về hai chân lý: tục đế và chân đế.|Gốc Latin ultimus là cuối cùng. Phân biệt với supreme: ultimate nhấn vào \"điểm cuối\"; supreme nhấn vào \"cao nhất\".", "awakening|awake (adj.) thức; awaken (v.) đánh thức; awakened (adj.) đã giác ngộ|a rude awakening = sự vỡ mộng phũ phàng; spiritual awakening = sự thức tỉnh tâm linh|Moving to a big city was a rude awakening for the country boy.|Chuyển lên thành phố lớn là một cú vỡ mộng với chàng trai quê.|The word \"Buddha\" means \"the one who has achieved awakening\".|Chữ \"Buddha\" có nghĩa là \"người đã thức tỉnh\".|\"Buddha\" xuất phát từ gốc Phạn budh là thức dậy. Vì vậy nhiều sách dịch giác ngộ là awakening thay vì enlightenment.", "selflessness|selfless (adj.) vị tha; self (n.) bản thân; selfish (adj.) ích kỷ (trái nghĩa)|an act of selflessness = một hành động vị tha; the teaching of selflessness = giáo lý vô ngã|The nurse's selflessness during the flood moved everyone.|Sự quên mình của cô y tá trong trận lũ làm mọi người xúc động.|The teaching of selflessness says there is no fixed, unchanging self.|Giáo lý vô ngã nói rằng không có một cái tôi cố định, bất biến.|self + -less (không) + -ness (danh từ) = trạng thái không có cái tôi. Đời thường: vị tha; Phật học: vô ngã.", "all-encompassing|encompass (v.) bao gồm, bao quanh; compass (n.) la bàn, phạm vi|an all-encompassing love/view = tình yêu/cái nhìn bao trùm tất cả|The new law is all-encompassing and affects every business in the country.|Luật mới mang tính bao trùm, ảnh hưởng đến mọi doanh nghiệp trong nước.|The Buddha's compassion is described as all-encompassing, like the sky.|Lòng từ bi của Phật được mô tả là bao trùm tất cả, như bầu trời.|all (tất cả) + en- (trong) + compass (vòng tròn) = ôm trọn mọi thứ vào trong vòng tròn.", "phenomena|phenomenon (n.) hiện tượng (số ít); phenomenal (adj.) phi thường|natural phenomena = hiện tượng tự nhiên; mental phenomena = hiện tượng tâm lý; all phenomena are impermanent = vạn pháp vô thường|Scientists are studying strange weather phenomena around the world.|Các nhà khoa học đang nghiên cứu những hiện tượng thời tiết kỳ lạ trên thế giới.|The Buddha taught that all phenomena are impermanent.|Đức Phật dạy rằng vạn pháp đều vô thường.|Số ít phenomenon, số nhiều phenomena (như criterion → criteria). Trong kinh tiếng Anh, \"pháp\" cũng thường dịch là phenomena.", "wisdom|wise (adj.) khôn ngoan; wisely (adv.) một cách khôn ngoan|words of wisdom = lời khuyên sáng suốt; wisdom tooth = răng khôn; wisdom and compassion = bi và trí|I had my wisdom tooth taken out last week.|Tuần trước tôi đã nhổ răng khôn.|Manjushri is the Bodhisattva of wisdom.|Văn Thù Sư Lợi là vị Bồ-tát của trí tuệ.|wise (khôn) + -dom (trạng thái, như freedom, kingdom). \"Bi trí song tu\" là cultivating both compassion and wisdom.", "recollect|recollection (n.) ký ức; collect (v.) thu thập|recollect + V-ing = nhớ lại đã làm gì; as far as I can recollect = theo như tôi nhớ|As far as I can recollect, the shop used to be on this corner.|Theo như tôi nhớ, cửa hàng đó từng ở góc này.|Before sleeping, the monk tries to recollect his actions of the day.|Trước khi ngủ, vị sư cố nhớ lại những việc mình đã làm trong ngày.|re- (lại) + collect (gom) = gom ký ức lại. Trang trọng hơn remember. \"Niệm Phật, niệm Pháp\" đôi khi dịch là recollection.", "eons|eon (n.) kiếp (số ít, Anh-Anh: aeon); eternal (adj.) vĩnh hằng|for eons = suốt hàng thiên niên kỷ; eons ago = từ vô số năm trước|I haven't seen you for eons! How are you?|Lâu lắm rồi mới gặp bạn! Bạn khỏe không?|The sutras say a Bodhisattva practises for countless eons before becoming a Buddha.|Kinh nói Bồ-tát tu hành trải qua vô số kiếp trước khi thành Phật.|Anh-Anh hay viết aeons. Văn nói: \"for eons\" là lâu lắm rồi (cường điệu, như for ages). Trong kinh, \"kiếp\" (kalpa) dịch là eon.", "perceived|perceive (v.) nhận thấy; perception (n.) nhận thức, tri giác; perceptive (adj.) tinh ý|perceived as = được xem là; perceived risk/value = rủi ro/giá trị được cảm nhận|At first, the new teacher was perceived as strict, but students soon loved her.|Ban đầu cô giáo mới bị xem là nghiêm khắc, nhưng học sinh nhanh chóng yêu quý cô.|What is perceived through the senses is always changing.|Những gì được cảm nhận qua các giác quan luôn luôn thay đổi.|perceive → perception (đổi -ceive thành -ception, giống receive → reception). Trong ngũ uẩn, \"tưởng\" là perception.", "karma|karmic (adj.) thuộc về nghiệp|good/bad karma = nghiệp thiện/ác; create karma = tạo nghiệp; karmic retribution = quả báo|When he found the money he had lost, he joked that it was good karma.|Khi tìm lại được số tiền đánh mất, anh đùa rằng đó là nghiệp lành.|According to the Buddha, karma means intentional action of body, speech and mind.|Theo Đức Phật, nghiệp là hành động có chủ ý của thân, khẩu, ý.|Tiếng Phạn karma là hành động. Nghiệp không phải định mệnh, mà là hành động có tác ý và hệ quả của nó.", "delusion|delude (v.) đánh lừa; deluded (adj.) bị ảo tưởng; illusion (n.) ảo ảnh (dễ nhầm)|under the delusion that = ảo tưởng rằng; greed, hatred and delusion = tham, sân, si; delusions of grandeur = ảo tưởng mình vĩ đại|He lives in the delusion that everyone admires him.|Anh ta sống trong ảo tưởng rằng ai cũng ngưỡng mộ mình.|Greed, hatred and delusion are called the three poisons.|Tham, sân, si được gọi là ba độc.|Phân biệt: illusion là ảo ảnh của giác quan (ảo thuật); delusion là niềm tin sai lầm bám chặt. \"Si\" trong tham-sân-si là delusion.", "entanglement|entangle (v.) làm vướng vào; tangle (n./v.) mớ rối; entangled (adj.) bị vướng|emotional entanglement = vướng mắc tình cảm; political entanglements = những vướng víu chính trị|The dolphin died after an entanglement in a fishing net.|Con cá heo chết sau khi bị mắc vào lưới đánh cá.|Monks leave home to be free from the entanglement of worldly duties.|Các nhà sư xuất gia để thoát khỏi sự ràng buộc của bổn phận thế tục.|en- (vào) + tangle (mớ rối) + -ment = bị cuốn vào mớ rối. Hình ảnh: dây leo quấn quanh cây.", "serene|serenity (n.) sự thanh thản; serenely (adv.) một cách thanh thản|a serene smile/face = nụ cười/gương mặt thanh thản; calm and serene = điềm tĩnh, thanh thản|Even in the busy airport, she remained calm and serene.|Ngay cả ở sân bay đông đúc, cô vẫn bình tĩnh và thanh thản.|The Buddha statue has a serene smile that calms visitors.|Tượng Phật có nụ cười thanh thản khiến du khách thấy bình yên.|Gốc Latin serenus là trời quang, không mây. Đọc /səˈriːn/.", "stillness|still (adj.) tĩnh lặng; still (adv.) vẫn|the stillness of the night/forest = sự tĩnh lặng của đêm/rừng; inner stillness = sự tĩnh lặng nội tâm|The stillness of the forest was broken by a bird's call.|Sự tĩnh lặng của khu rừng bị phá vỡ bởi tiếng chim kêu.|Meditation helps us find stillness even in a noisy world.|Thiền giúp ta tìm thấy sự tĩnh lặng ngay cả trong một thế giới ồn ào.|still (đứng yên) + -ness. Đừng nhầm với still nghĩa \"vẫn\" (I still love you). Sit still là ngồi yên.", "infinite|finite (adj.) hữu hạn; infinity (n.) vô cực; infinitely (adv.) vô cùng|infinite patience/space = sự kiên nhẫn/không gian vô hạn; infinitely better = tốt hơn vô cùng|The internet seems to offer an infinite amount of information.|Internet dường như cung cấp lượng thông tin vô hạn.|Amitabha means \"the Buddha of infinite light\".|A-di-đà nghĩa là \"vị Phật của ánh sáng vô lượng\".|in- (không) + finite (có giới hạn). Đọc /ˈɪn.fɪ.nət/ (nhấn âm đầu), khác hẳn finite /ˈfaɪ.naɪt/.", "embraced|embrace (v./n.) ôm, đón nhận; cái ôm|embrace an idea/change = đón nhận ý tưởng/thay đổi; warmly embraced = ôm thắm thiết|The company quickly embraced the new technology.|Công ty nhanh chóng đón nhận công nghệ mới.|Many Westerners have embraced Buddhist meditation in recent years.|Nhiều người phương Tây đã đón nhận thiền Phật giáo trong những năm gần đây.|em- (vào) + brace (hai cánh tay, gốc Latin bracchium). Nghĩa bóng \"đón nhận\" rất hay dùng: embrace change.", "unconditional|condition (n.) điều kiện; conditional (adj.) có điều kiện; unconditionally (adv.) vô điều kiện|unconditional love/support = tình yêu/sự ủng hộ vô điều kiện; unconditional surrender = đầu hàng vô điều kiện|The war ended with the unconditional surrender of the army.|Cuộc chiến kết thúc với sự đầu hàng vô điều kiện của quân đội.|Loving-kindness is unconditional: it is offered to friends and enemies alike.|Lòng từ là vô điều kiện: được trao cho cả bạn lẫn kẻ thù.|un- (không) + condition + -al. Cả họ condition, conditions đều có trong danh sách.", "radiance|radiate (v.) tỏa ra; radiating (v-ing) đang tỏa ra; radiant (adj.) rạng rỡ|the radiance of the sun = ánh sáng rực rỡ của mặt trời; inner radiance = vẻ rạng ngời từ bên trong|After the holiday, her skin had a healthy radiance.|Sau kỳ nghỉ, làn da cô ấy rạng rỡ khỏe mạnh.|The radiance of the candles filled the meditation hall.|Ánh sáng của những ngọn nến tràn ngập thiền đường.|radiant (rạng rỡ) → radiance (danh từ, -ant đổi thành -ance). Xem thêm radiating.", "gentle|gently (adv.) nhẹ nhàng; gentleness (n.) sự dịu dàng; gentleman (n.) quý ông|a gentle voice/breeze = giọng nói/làn gió nhẹ; gentle exercise = vận động nhẹ; be gentle with = nhẹ nhàng với|The doctor recommended gentle exercise such as walking or yoga.|Bác sĩ khuyên vận động nhẹ như đi bộ hoặc yoga.|Be gentle with yourself when your mind wanders during meditation.|Hãy nhẹ nhàng với chính mình khi tâm lang thang trong lúc thiền.|Trạng từ là gently (không phải gentlely). Gentleman xưa là \"người con nhà tử tế, cư xử nhẹ nhàng\".", "shade|shady (adj.) có bóng mát; mờ ám; shadow (n.) cái bóng|in the shade = trong bóng râm; provide shade = che bóng mát; a shade of blue = một sắc xanh|Let's find some shade; the sun is too strong.|Mình tìm chỗ râm đi; nắng gắt quá.|The Buddha sat in the shade of the Bodhi tree for many days.|Đức Phật ngồi dưới bóng cội Bồ-đề nhiều ngày.|Phân biệt: shade là vùng râm mát (sit in the shade); shadow là cái bóng có hình dạng (my shadow on the wall).", "sheltering|shelter (n./v.) nơi trú ẩn; che chở; sheltered (adj.) được che chở|sheltering from the rain = trú mưa; sheltering refugees = che chở người tị nạn|We spent an hour sheltering from the rain under a bridge.|Chúng tôi trú mưa dưới gầm cầu suốt một tiếng.|The Three Jewels are like a roof sheltering us from the storms of life.|Tam Bảo như mái nhà che chở ta khỏi giông bão cuộc đời.|\"Quy y\" Tam Bảo dịch là take refuge, gần nghĩa với shelter (nơi nương tựa). Giới từ: shelter FROM sth.", "scorching|scorch (v.) làm cháy sém; scorched (adj.) bị cháy sém|scorching heat/sun = cái nóng/nắng thiêu đốt; a scorching summer = mùa hè nóng như đổ lửa|The football match was played in scorching heat.|Trận bóng diễn ra trong cái nóng như thiêu.|The monks walked barefoot on the scorching road to collect alms.|Các nhà sư đi chân trần trên con đường nóng bỏng để khất thực.|Mạnh hơn hot rất nhiều. Thang độ: warm → hot → boiling → scorching.", "existence|exist (v.) tồn tại; existing (adj.) hiện có; existential (adj.) thuộc sự tồn tại|come into existence = ra đời; the existence of = sự tồn tại của; a peaceful existence = cuộc sống yên bình|The company came into existence in 1995.|Công ty ra đời năm 1995.|The Buddha described existence as marked by impermanence, suffering and non-self.|Đức Phật mô tả sự tồn tại mang ba dấu ấn: vô thường, khổ và vô ngã.|exist + -ence. Chính tả hay sai: existEnce (không phải existance).", "Tripitaka|Tipitaka (n.) Tam Tạng (tiếng Pali); sutra (n.) kinh|the Pali Tripitaka = Tam Tạng Pali; study the Tripitaka = nghiên cứu Tam Tạng|The library keeps a rare copy of the Chinese Tripitaka.|Thư viện lưu giữ một bản Tam Tạng chữ Hán quý hiếm.|The Tripitaka has three parts: the Sutras, the Vinaya and the Abhidharma.|Tam Tạng gồm ba phần: Kinh, Luật và Luận.|Phạn: tri (ba) + pitaka (giỏ) = \"ba giỏ\", vì xưa kinh lá bối được để trong giỏ. Ba tạng: Kinh (Sutra), Luật (Vinaya), Luận (Abhidharma).", "causality|cause (n./v.) nguyên nhân; gây ra; causal (adj.) thuộc nhân quả|the law of causality = luật nhân quả; cause and effect = nguyên nhân và kết quả|Scientists must prove causality, not just a connection between two things.|Các nhà khoa học phải chứng minh quan hệ nhân quả, chứ không chỉ mối liên hệ giữa hai điều.|Understanding causality helps us take responsibility for our actions.|Hiểu nhân quả giúp ta chịu trách nhiệm về hành động của mình.|cause + -al + -ity. Văn nói thường dùng \"cause and effect\"; causality trang trọng, học thuật hơn.", "aware|awareness (n.) sự nhận biết, tỉnh giác; unaware (adj.) không biết|be aware of / that = biết, nhận thức được; become aware of = nhận ra; environmentally aware = có ý thức môi trường|She became aware that someone was following her.|Cô nhận ra có ai đó đang đi theo mình.|In mindfulness practice, we stay aware of each breath.|Khi thực tập chánh niệm, ta luôn biết rõ từng hơi thở.|Đi với of hoặc that: be aware OF sth / aware THAT... Danh từ awareness (\"tỉnh giác\") rất hay gặp trong sách thiền.", "appropriate|appropriately (adv.) một cách phù hợp; inappropriate (adj.) không phù hợp; misappropriate (v.) biển thủ|appropriate for/to = phù hợp với; it is appropriate to = nên, phù hợp để|Is this film appropriate for young children?|Bộ phim này có phù hợp với trẻ nhỏ không?|Silence is the appropriate way to behave in the meditation hall.|Im lặng là cách cư xử phù hợp trong thiền đường.|Tính từ đọc /əˈprəʊ.pri.ət/ (đuôi \"ợt\"); động từ appropriate (chiếm dụng) đọc đuôi /-eɪt/. Cùng gốc misappropriate.", "examine|examination (n.) kỳ thi, sự kiểm tra; examiner (n.) giám khảo|examine closely/carefully = xem xét kỹ; examine the evidence = xem xét bằng chứng; examine your mind = quán xét tâm mình|The police will examine the evidence carefully.|Cảnh sát sẽ xem xét bằng chứng một cách cẩn thận.|The Buddha told his followers to examine his teachings before accepting them.|Đức Phật dặn đệ tử hãy xem xét lời Ngài dạy trước khi chấp nhận.|\"Exam\" là dạng rút gọn của examination. Kinh Kalama: đừng tin vội, hãy tự xem xét rồi mới chấp nhận.", "blindly|blind (adj.) mù; blindness (n.) sự mù lòa; blindfold (n.) khăn bịt mắt|blindly follow/obey/believe = mù quáng làm theo/vâng lời/tin|He blindly trusted the online advert and lost his money.|Anh ta tin mù quáng vào quảng cáo trên mạng và mất tiền.|Faith in Buddhism should be based on understanding, not blindly accepted.|Niềm tin trong đạo Phật nên dựa trên sự hiểu biết, không phải chấp nhận một cách mù quáng.|blind + -ly. Trái nghĩa: critically (có phê phán), thoughtfully (có suy xét).", "evaluation|evaluate (v.) đánh giá; value (n.) giá trị|carry out an evaluation = tiến hành đánh giá; self-evaluation = tự đánh giá|Each employee has a performance evaluation at the end of the year.|Mỗi nhân viên được đánh giá hiệu quả công việc vào cuối năm.|Regular self-evaluation helps a practitioner see their own faults.|Thường xuyên tự đánh giá giúp người tu thấy được lỗi của chính mình.|e- (ra) + value (giá trị) + -ation = tìm ra giá trị. Cùng họ với value.", "correct|correction (n.) sự sửa chữa; correctly (adv.) một cách chính xác; incorrect (adj.) sai|correct answer = câu trả lời đúng; correct a mistake = sửa lỗi; politically correct = đúng mực về chính trị|Please correct me if I make a mistake.|Hãy sửa giúp tôi nếu tôi mắc lỗi.|A good teacher will gently correct a student's posture in meditation.|Người thầy giỏi sẽ nhẹ nhàng chỉnh tư thế ngồi thiền cho học trò.|Vừa là tính từ (đúng) vừa là động từ (sửa). Phân biệt với right: correct nhấn vào \"không có lỗi\", right còn nghĩa \"đúng đạo lý\".", "worship|worshipper (n.) người thờ phụng|place of worship = nơi thờ tự; ancestor worship = thờ cúng tổ tiên; worship the Buddha = lễ Phật|Ancestor worship is an important tradition in Vietnam.|Thờ cúng tổ tiên là truyền thống quan trọng ở Việt Nam.|Visitors should dress modestly in any place of worship.|Du khách nên ăn mặc kín đáo ở bất kỳ nơi thờ tự nào.|Anh-Anh: worshipped, worshipping (2 chữ p); Anh-Mỹ: worshiped. Phật tử thường nói \"pay respect to the Buddha\" hơn \"worship\".", "doctrines|doctrine (n.) giáo lý (số ít); doctrinal (adj.) thuộc giáo lý|religious doctrines = giáo lý tôn giáo; political doctrines = học thuyết chính trị|The two parties follow very different economic doctrines.|Hai đảng theo những học thuyết kinh tế rất khác nhau.|Buddhist doctrines such as the Four Noble Truths are taught in every school of Buddhism.|Những giáo lý như Tứ Diệu Đế được giảng dạy trong mọi tông phái Phật giáo.|Gốc Latin docere là dạy (như doctor, xưa nghĩa là \"thầy\"). Xem thêm doctrine.", "sainthoods|saint (n.) vị thánh; sainthood (n.) thánh quả (số ít); saintly (adj.) thánh thiện|the four sainthoods = bốn thánh quả; attain sainthood = chứng thánh quả|Different religions describe their sainthoods in very different ways.|Các tôn giáo khác nhau mô tả thánh quả của mình theo những cách rất khác nhau.|In Theravada Buddhism, the four sainthoods are stream-entry, once-return, non-return and arahantship.|Trong Phật giáo Nguyên thủy, bốn thánh quả là Tu-đà-hoàn, Tư-đà-hàm, A-na-hàm và A-la-hán.|saint + -hood (trạng thái, như childhood, motherhood). Dạng số nhiều sainthoods khá hiếm, thường gặp số ít sainthood.", "renounce|renouncing (v-ing); renunciation (n.) sự xuất ly, từ bỏ|renounce violence/the world = từ bỏ bạo lực/thế tục; renounce a title = từ bỏ tước vị|The rebels agreed to renounce violence.|Những người nổi dậy đồng ý từ bỏ bạo lực.|To become a monk, one must renounce family life.|Muốn làm tăng sĩ, phải từ bỏ đời sống gia đình.|re- (ngược lại) + nounce (tuyên bố, như announce) = tuyên bố từ bỏ. Trang trọng hơn give up, thường mang tính chính thức hoặc tâm linh.", "thoroughly|thorough (adj.) kỹ lưỡng; thoroughness (n.) sự kỹ lưỡng|thoroughly enjoy = rất thích; thoroughly clean/check = lau chùi/kiểm tra kỹ|We thoroughly enjoyed our trip to Hue.|Chúng tôi thực sự thích chuyến đi Huế.|Before the festival, the monks thoroughly cleaned every corner of the temple.|Trước lễ hội, các nhà sư lau dọn kỹ lưỡng mọi góc chùa.|Đọc /ˈθʌr.ə.li/, đừng nhầm với through /θruː/ hay though /ðəʊ/.", "offerings|offer (v./n.) dâng, đề nghị; offering (n.) lễ vật (số ít)|make offerings = dâng lễ vật, cúng dường; offerings of flowers/incense = lễ vật hoa/hương|The new album is one of the best offerings from the band.|Album mới là một trong những sản phẩm hay nhất của ban nhạc.|Lay people make offerings of food to the monks every morning.|Phật tử tại gia cúng dường thức ăn cho các nhà sư mỗi sáng.|offer + -ing thành danh từ \"vật được dâng\". \"Cúng dường\" là make offerings. Nghĩa thương mại: sản phẩm mới (the latest offerings).", "distinguish|distinction (n.) sự khác biệt; distinguished (adj.) lỗi lạc; distinct (adj.) riêng biệt|distinguish between A and B = phân biệt A và B; distinguish A from B = phân biệt A với B|Can you distinguish between British and American accents?|Bạn có phân biệt được giọng Anh và giọng Mỹ không?|Wisdom is the ability to distinguish what is wholesome from what is unwholesome.|Trí tuệ là khả năng phân biệt điều thiện với điều bất thiện.|Hai cấu trúc: distinguish BETWEEN A AND B / distinguish A FROM B. Tính từ distinguished là lỗi lạc: a distinguished scholar.", "genuine|genuinely (adv.) thật sự; genuineness (n.) sự chân thật|genuine leather = da thật; genuine interest/concern = sự quan tâm thật lòng|Is this bag made of genuine leather?|Chiếc túi này làm bằng da thật phải không?|Genuine practice shows in how we treat others, not in how long we sit.|Sự tu tập chân thật thể hiện ở cách ta đối xử với người khác, không ở việc ngồi thiền bao lâu.|Đọc /ˈdʒen.ju.ɪn/, đuôi \"-in\" chứ không phải \"-ain\". Trái nghĩa: fake, false.", "monastic|monastery (n.) tu viện; monk (n.) tăng sĩ; monasticism (n.) đời sống tu viện|monastic life = đời sống tu sĩ; monastic rules/robes = giới luật/y áo của tu sĩ; the monastic community = Tăng đoàn|The old monastic buildings are now a museum.|Những tòa nhà tu viện cũ giờ là bảo tàng.|The Vinaya contains the rules of monastic discipline.|Tạng Luật chứa đựng các giới điều của đời sống tu sĩ.|Gốc Hy Lạp monos là một mình (như monk, monologue), vì tu sĩ xưa sống đơn độc. monastic (adj.) đi đôi với monastery (n.).", "appearances|appear (v.) xuất hiện; appearance (n.) vẻ ngoài (số ít); disappear (v.) biến mất|keep up appearances = giữ thể diện; judge by appearances = đánh giá qua vẻ ngoài; appearances can be deceptive = vẻ ngoài có thể đánh lừa|They kept up appearances even after losing all their money.|Họ vẫn giữ thể diện ngay cả sau khi mất hết tiền.|The monk warned that appearances can be deceptive: a robe does not make a saint.|Vị sư cảnh tỉnh rằng vẻ ngoài có thể đánh lừa: chiếc áo không làm nên thầy tu.|Thành ngữ \"Appearances can be deceptive\" gần với \"Chiếc áo không làm nên thầy tu\". Số ít appearance còn nghĩa \"sự xuất hiện\".", "reliability|rely (v.) dựa vào; reliable (adj.) đáng tin cậy; reliably (adv.) một cách đáng tin|reliability of information/data = độ tin cậy của thông tin/dữ liệu|Journalists must check the reliability of their sources.|Nhà báo phải kiểm tra độ tin cậy của nguồn tin.|Scholars compare old manuscripts to judge the reliability of each sutra text.|Các học giả so sánh những bản chép tay cổ để đánh giá độ tin cậy của từng bản kinh.|rely (dựa vào) → reliable (đáng dựa vào) → reliability. Chú ý đổi y thành i: rely → reliable.", "repentance|repent (v.) sám hối; repentant (adj.) ăn năn|show/express repentance = bày tỏ sự hối cải; a ceremony of repentance = lễ sám hối|The thief's tears seemed to show genuine repentance.|Những giọt nước mắt của tên trộm dường như cho thấy sự hối cải thật lòng.|Many temples hold a repentance ceremony on the full moon day.|Nhiều chùa tổ chức lễ sám hối vào ngày rằm.|re- + pent (hối tiếc, gốc Latin paenitere) + -ance. \"Lễ sám hối\" là repentance ceremony. Xem thêm repent.", "felonies|felony (n.) trọng tội (số ít); felon (n.) kẻ phạm trọng tội|commit a felony = phạm trọng tội; be charged with a felony = bị buộc tội trọng tội|In the US, felonies are crimes punished by more than a year in prison.|Ở Mỹ, trọng tội là những tội bị phạt tù trên một năm.|Killing and stealing are felonies under the law and serious violations of the precepts.|Giết người và trộm cắp là trọng tội theo luật pháp và là sự vi phạm nghiêm trọng giới luật.|Thuật ngữ pháp lý Mỹ: felony (trọng tội) đối lập với misdemeanor (khinh tội). Số nhiều: y đổi thành ies.", "sincerely|sincere (adj.) chân thành; sincerity (n.) sự chân thành|Yours sincerely = Trân trọng (cuối thư trang trọng); sincerely hope/thank = chân thành mong/cảm ơn|End a formal letter with \"Yours sincerely\" if you know the person's name.|Kết thư trang trọng bằng \"Yours sincerely\" nếu bạn biết tên người nhận.|When you bow, do it sincerely, with your whole mind.|Khi lạy, hãy lạy một cách chân thành, với trọn vẹn tâm ý.|Thư trang trọng (Anh-Anh): biết tên người nhận thì \"Yours sincerely\"; không biết tên thì \"Yours faithfully\".", "repent|repentance (n.) sự sám hối; repentant (adj.) ăn năn|repent of sth = ăn năn về điều gì; repent your sins = sám hối tội lỗi|He will repent of his angry words when he calms down.|Anh ấy sẽ ân hận vì những lời nóng giận khi bình tĩnh lại.|To repent sincerely means to admit the mistake and promise not to repeat it.|Sám hối chân thành nghĩa là thừa nhận lỗi lầm và nguyện không tái phạm.|Trang trọng, mang màu tôn giáo. Văn nói thường dùng regret. Đi với of: repent OF sth.", "declare|declaration (n.) lời tuyên bố, tờ khai; declared (adj.) đã công bố|declare war = tuyên chiến; declare independence = tuyên bố độc lập; anything to declare? = có gì cần khai báo không?|Do you have anything to declare at customs?|Bạn có gì cần khai báo ở hải quan không?|At the ceremony, the new Buddhists declare that they take refuge in the Three Jewels.|Trong buổi lễ, những Phật tử mới tuyên bố quy y Tam Bảo.|Danh từ declaration: Tuyên ngôn Độc lập là the Declaration of Independence.", "observe|observation (n.) sự quan sát; observance (n.) sự tuân thủ; observer (n.) người quan sát|observe the rules/precepts = tuân thủ luật/giữ giới; observe a minute's silence = mặc niệm một phút|Scientists observe the behaviour of birds in the forest.|Các nhà khoa học quan sát hành vi của chim trong rừng.|In meditation, we simply observe our thoughts without judging them.|Khi thiền, ta chỉ quan sát ý nghĩ mà không phán xét chúng.|Hai nghĩa: quan sát (danh từ observation) và tuân thủ (danh từ observance). \"Giữ giới\" là observe the precepts.", "morality|moral (adj./n.) thuộc đạo đức; bài học; morally (adv.) về mặt đạo đức; immoral (adj.) vô đạo đức|public morality = đạo đức xã hội; morality, concentration and wisdom = giới, định, tuệ|Parents and schools both play a role in teaching morality.|Cha mẹ và nhà trường đều có vai trò dạy đạo đức.|The path is often summed up as morality, concentration and wisdom.|Con đường tu thường được tóm lại thành giới, định, tuệ.|moral + -ity. Trong Phật học, \"giới\" (sila) thường dịch là morality hoặc ethics.", "extraordinary|ordinary (adj.) bình thường; extraordinarily (adv.) phi thường|extraordinary talent/achievement = tài năng/thành tựu phi thường; an extraordinary meeting = cuộc họp bất thường|The company held an extraordinary meeting to discuss the crisis.|Công ty tổ chức một cuộc họp bất thường để bàn về khủng hoảng.|The life of the Buddha is an extraordinary story of a prince who gave up everything.|Cuộc đời Đức Phật là câu chuyện phi thường về một hoàng tử từ bỏ tất cả.|extra (vượt ngoài) + ordinary (bình thường). Anh-Anh hay nuốt âm: /ɪkˈstrɔːd.nər.i/.", "circumstances|circumstance (n.) hoàn cảnh (số ít); circumstantial (adj.) gián tiếp|under no circumstances = trong bất kỳ hoàn cảnh nào cũng không; in the circumstances = trong hoàn cảnh này; circumstances beyond our control = lý do bất khả kháng|Due to circumstances beyond our control, the flight has been cancelled.|Vì lý do bất khả kháng, chuyến bay đã bị hủy.|We cannot always change our circumstances, but we can change how we respond.|Ta không phải lúc nào cũng thay đổi được hoàn cảnh, nhưng có thể thay đổi cách mình phản ứng.|circum- (xung quanh) + stance (đứng) = những gì đứng quanh ta. \"Under no circumstances\" đứng đầu câu thì đảo ngữ: Under no circumstances should you...", "protection|protect (v.) bảo vệ; protective (adj.) che chở; protector (n.) người bảo vệ|protection against/from = sự bảo vệ chống lại; environmental protection = bảo vệ môi trường; under the protection of = dưới sự che chở của|Environmental protection should be everyone's concern.|Bảo vệ môi trường nên là mối quan tâm của mọi người.|Many people wear a Buddha pendant for protection on long journeys.|Nhiều người đeo mặt Phật để được che chở trong những chuyến đi xa.|protect + -ion. Giới từ: protection AGAINST hoặc FROM sth.", "suicide|suicidal (adj.) có ý định tự tử|suicide prevention = phòng chống tự tử; a suicide hotline = đường dây nóng phòng chống tự tử|The school runs a suicide prevention programme to help students who are struggling.|Trường có chương trình phòng chống tự tử để giúp những học sinh đang gặp khó khăn.|Talking openly with someone you trust is one of the best ways to prevent suicide.|Trò chuyện cởi mở với người mình tin tưởng là một trong những cách tốt nhất để phòng ngừa tự tử.|sui (bản thân, tiếng Latin) + -cide (giết, như pesticide). Nếu bạn hoặc người thân đang có ý nghĩ này, hãy tìm đến người tin cậy hoặc chuyên gia tâm lý.", "constitutes|constitute (v.) cấu thành; constitution (n.) hiến pháp; constituent (n.) thành phần|constitutes a crime/threat = cấu thành tội/mối đe dọa; what constitutes = điều gì tạo nên|This email constitutes a legal agreement between the two companies.|Email này cấu thành một thỏa thuận pháp lý giữa hai công ty.|What constitutes a good life, according to the Buddha?|Theo Đức Phật, điều gì tạo nên một cuộc sống tốt đẹp?|Trang trọng hơn make up hoặc form. Danh từ constitution là hiến pháp (cái \"cấu thành\" nhà nước).", "violation|violate (v.) vi phạm; violator (n.) người vi phạm|a violation of the law/rules = sự vi phạm luật; human rights violations = vi phạm nhân quyền; in violation of = vi phạm|Using someone's photos without permission is a violation of their privacy.|Dùng ảnh của người khác khi chưa được phép là xâm phạm quyền riêng tư của họ.|For a monk, drinking alcohol is a clear violation of the precepts.|Đối với một nhà sư, uống rượu là vi phạm giới luật rõ ràng.|violate + -ion. Đừng nhầm với violent, violence (bạo lực), dù cùng gốc Latin vis là sức mạnh.", "marine|maritime (adj.) thuộc hàng hải; submarine (n.) tàu ngầm; mariner (n.) thủy thủ|marine life = sinh vật biển; marine biologist = nhà sinh vật học biển; marine pollution = ô nhiễm biển|My sister wants to become a marine biologist.|Em gái tôi muốn trở thành nhà sinh vật học biển.|The monastery near the coast teaches children to respect marine creatures.|Ngôi chùa gần bờ biển dạy trẻ em tôn trọng các sinh vật biển.|Gốc Latin mare là biển (như submarine là dưới biển). Đọc /məˈriːn/, nhấn âm hai.", "long-lived|live (v.) sống; life (n.) cuộc sống; lifespan (n.) tuổi thọ|long-lived species/tradition = loài/truyền thống tồn tại lâu đời|The festival is a long-lived tradition in our village.|Lễ hội là một truyền thống lâu đời ở làng tôi.|In Buddhist stories, people who protect life are reborn healthy and long-lived.|Trong các câu chuyện Phật giáo, người bảo vệ sự sống được tái sinh khỏe mạnh và trường thọ.|Đọc /ˌlɒŋˈlɪvd/ (âm i ngắn như live động từ). Gần nghĩa: long-lasting (dùng cho đồ vật, cảm xúc).", "fearless|fear (n./v.) nỗi sợ; fearful (adj.) sợ hãi; fearlessness (n.) sự vô úy|fearless leader/fighter = người lãnh đạo/chiến binh dũng cảm; the gift of fearlessness = vô úy thí|The fearless firefighter ran back into the burning house.|Người lính cứu hỏa gan dạ chạy trở lại ngôi nhà đang cháy.|A Bodhisattva is fearless when facing suffering, because his heart is full of compassion.|Bồ-tát không sợ hãi khi đối diện khổ đau, vì tâm ngài tràn đầy từ bi.|fear + -less. Đối lập: fearful (-ful là đầy). \"Thí vô úy\" (ban sự không sợ hãi) là the gift of fearlessness.", "prohibit|prohibition (n.) lệnh cấm; prohibited (adj.) bị cấm|prohibit sb from doing sth = cấm ai làm gì; strictly prohibited = nghiêm cấm|The new law will prohibit smoking in all restaurants.|Luật mới sẽ cấm hút thuốc ở tất cả nhà hàng.|The five precepts prohibit killing, stealing and lying, among other things.|Năm giới cấm sát sinh, trộm cắp, nói dối, cùng những điều khác.|Trang trọng hơn ban hoặc forbid. Cấu trúc: prohibit sb FROM V-ing. Biển báo hay ghi \"Smoking prohibited\".", "droppings|drop (v./n.) rơi; giọt|bird/mouse droppings = phân chim/chuột|We found mouse droppings in the kitchen, so we called pest control.|Chúng tôi thấy phân chuột trong bếp nên đã gọi dịch vụ diệt côn trùng.|Every morning the novice sweeps the pigeon droppings from the temple steps.|Mỗi sáng chú tiểu quét phân chim bồ câu trên bậc thềm chùa.|Luôn ở số nhiều khi chỉ phân động vật nhỏ. Không mang nghĩa \"đồ đánh rơi\" (đồ đánh rơi là lost items).", "donate|donation (n.) khoản quyên góp; donor (n.) người hiến tặng|donate money/blood/organs = quyên góp tiền/hiến máu/hiến tạng; donate to charity = quyên góp từ thiện|My father goes to the hospital to donate blood twice a year.|Bố tôi đến bệnh viện hiến máu hai lần mỗi năm.|Families often donate rice and vegetables to the temple kitchen.|Các gia đình thường cúng gạo và rau cho nhà bếp của chùa.|donate sth TO sb/sth (không nói donate sb sth). Danh từ: donation; người hiến: donor (blood donor).", "blessing|bless (v.) ban phước; blessed (adj.) có phước|a blessing in disguise = trong cái rủi có cái may; give your blessing = chấp thuận, chúc phúc; count your blessings = biết ơn những gì mình có|Losing that job was a blessing in disguise.|Mất công việc đó hóa ra lại là trong cái rủi có cái may.|The couple asked the abbot for his blessing before their wedding.|Đôi bạn trẻ xin sư trụ trì chúc phúc trước lễ cưới.|Thành ngữ hay: \"a blessing in disguise\" (phúc ẩn trong họa); \"count your blessings\" (hãy biết đủ, biết ơn).", "abuse|abusive (adj.) lạm dụng, ngược đãi; abuser (n.) kẻ lạm dụng|abuse of power = lạm quyền; drug/alcohol abuse = lạm dụng ma túy/rượu; abuse sb's trust = lợi dụng lòng tin|The minister was accused of abuse of power.|Bộ trưởng bị cáo buộc lạm quyền.|A teacher should never abuse the trust of his students.|Người thầy không bao giờ được lợi dụng lòng tin của học trò.|Danh từ đọc /əˈbjuːs/ (âm s), động từ đọc /əˈbjuːz/ (âm z). Nghĩa rộng: lạm dụng, ngược đãi, chửi mắng.", "bribery|bribe (n./v.) tiền hối lộ; đút lót|accused of bribery = bị cáo buộc hối lộ; bribery and corruption = hối lộ và tham nhũng|The football official was banned for life after a bribery scandal.|Vị quan chức bóng đá bị cấm hoạt động suốt đời sau vụ bê bối hối lộ.|Right livelihood means earning money honestly, without cheating or bribery.|Chánh mạng nghĩa là kiếm tiền lương thiện, không lừa gạt hay hối lộ.|bribe (tiền đút lót) + -ery (hành vi). Phân biệt: bribe là một khoản cụ thể; bribery là hành vi nói chung.", "corruption|corrupt (adj./v.) tham nhũng; làm hư hỏng; corrupted (adj.) bị hỏng (dữ liệu)|fight/tackle corruption = chống tham nhũng; widespread corruption = tham nhũng tràn lan|Corruption makes ordinary people lose trust in the government.|Tham nhũng khiến người dân mất niềm tin vào chính quyền.|Greed, if not controlled, can lead to corruption in any organization, even a religious one.|Lòng tham nếu không kiểm soát có thể dẫn đến tham nhũng trong bất kỳ tổ chức nào, kể cả tổ chức tôn giáo.|cor- (hoàn toàn) + rupt (vỡ, như interrupt, bankrupt) = làm hư hỏng hoàn toàn. Tin học: corrupted file là tệp bị hỏng.", "misappropriate|misappropriation (n.) sự biển thủ; appropriate (v.) chiếm dụng|misappropriate funds/money = biển thủ quỹ/tiền|The treasurer was jailed for trying to misappropriate the club's money.|Thủ quỹ bị bỏ tù vì tìm cách biển thủ tiền của câu lạc bộ.|To misappropriate money donated to a temple is considered very bad karma.|Biển thủ tiền cúng dường cho chùa được xem là tạo nghiệp rất nặng.|mis- (sai) + appropriate (chiếm làm của mình): chiếm dụng sai trái tài sản được giao giữ. Thuật ngữ pháp lý, rất trang trọng.", "preserve|preservation (n.) sự bảo tồn; preservative (n.) chất bảo quản|preserve the environment/culture = bảo tồn môi trường/văn hóa; preserve food = bảo quản thực phẩm|Salt has been used to preserve fish for thousands of years.|Muối đã được dùng để bảo quản cá suốt hàng ngàn năm.|Monks in Myanmar worked for years to preserve the Pali texts on stone.|Các nhà sư ở Myanmar đã làm việc nhiều năm để bảo tồn kinh điển Pali trên đá.|pre- (trước) + serve (giữ): giữ gìn từ trước để không mất. Danh từ preservation; chất bảo quản là preservative.", "destroy|destruction (n.) sự phá hủy; destructive (adj.) có tính phá hủy|completely destroy = phá hủy hoàn toàn; destroy evidence/trust = tiêu hủy bằng chứng/phá vỡ lòng tin|One lie can destroy years of trust.|Một lời nói dối có thể phá hủy lòng tin nhiều năm.|Anger can destroy in a moment the merit built over a long time.|Sân hận có thể phá hủy trong khoảnh khắc công đức tích lũy lâu dài.|destroy → destruction (đổi -oy thành -uction). Trái nghĩa: build, create, preserve.", "pollute|pollution (n.) sự ô nhiễm; pollutant (n.) chất gây ô nhiễm; polluted (adj.) bị ô nhiễm|pollute the air/water/environment = làm ô nhiễm không khí/nước/môi trường|Plastic bags pollute the oceans for hundreds of years.|Túi ni-lông làm ô nhiễm đại dương hàng trăm năm.|The monk said that harsh words pollute the mind just as smoke pollutes the air.|Vị sư nói lời lẽ thô ác làm ô nhiễm tâm, như khói làm ô nhiễm không khí.|Danh từ pollution rất hay gặp: air pollution, noise pollution (ô nhiễm tiếng ồn).", "retribution|retributive (adj.) mang tính trừng phạt|karmic retribution = quả báo; fear of retribution = sợ bị trả thù; divine retribution = sự trừng phạt của thần linh|Witnesses were afraid to speak because they feared retribution.|Các nhân chứng sợ lên tiếng vì sợ bị trả thù.|Karmic retribution is not a punishment from a god but the natural result of our actions.|Quả báo không phải sự trừng phạt từ thần linh mà là kết quả tự nhiên của hành động.|re- (lại) + tribute (trả, như contribute): \"trả lại\" tương xứng với việc đã làm. Thường mang nghĩa tiêu cực (trừng phạt, trả đũa).", "trivial|trivia (n.) chuyện vặt, kiến thức linh tinh; trivialize (v.) xem nhẹ|a trivial matter/mistake = chuyện/lỗi vặt vãnh; trivial things = những điều nhỏ nhặt|It may seem trivial, but small habits shape our lives.|Có vẻ nhỏ nhặt, nhưng thói quen nhỏ định hình cuộc đời ta.|The master said no wholesome act is trivial, not even offering a cup of water.|Vị thầy nói không có việc thiện nào là nhỏ nhặt, kể cả dâng một cốc nước.|Gốc Latin trivium là ngã ba đường, nơi người ta tán chuyện phiếm, nên mới thành \"chuyện vặt\". \"Trivia quiz\" là đố vui kiến thức linh tinh.", "punished|punish (v.) trừng phạt; punishment (n.) hình phạt|severely punished = bị trừng phạt nặng; be punished for (doing) sth = bị phạt vì|Players who break the rules will be punished.|Cầu thủ vi phạm luật sẽ bị xử phạt.|\"We are punished by our anger, not for our anger,\" says a well-known Buddhist saying.|\"Chúng ta bị chính cơn giận trừng phạt, chứ không phải bị phạt vì cơn giận,\" một câu nói Phật giáo nổi tiếng.|Phân biệt giới từ: punished FOR (vì lỗi gì) / punished BY (bởi ai, cái gì). Danh từ: punishment.", "serious|seriously (adv.) nghiêm túc; seriousness (n.) sự nghiêm trọng|take sth seriously = coi trọng; a serious illness/accident = bệnh/tai nạn nghiêm trọng; Are you serious? = Bạn nói thật chứ?|Are you serious about moving to Japan?|Bạn nghiêm túc về chuyện chuyển sang Nhật à?|Meditation is serious practice, but it should be done with a light heart.|Thiền là sự tu tập nghiêm túc, nhưng nên thực hành với tâm nhẹ nhàng.|\"Take sth seriously\" là coi trọng. Hai nghĩa: nghiêm trọng (vấn đề) và nghiêm túc (con người).", "adultery|adulterer (n.) người ngoại tình; adulterous (adj.) ngoại tình|commit adultery = ngoại tình|In the novel, the husband's adultery destroys the family.|Trong tiểu thuyết, sự ngoại tình của người chồng phá nát gia đình.|Avoiding adultery protects trust between husband and wife.|Tránh ngoại tình giữ gìn lòng tin giữa vợ và chồng.|Từ trang trọng, mang màu pháp lý hoặc tôn giáo; văn nói thường dùng \"have an affair\".", "loyal|loyalty (n.) lòng trung thành; loyally (adv.) một cách trung thành; disloyal (adj.) bất trung|loyal to sb/sth = trung thành với; loyal customers/fans = khách hàng/người hâm mộ trung thành|The shop gives discounts to its loyal customers.|Cửa hàng giảm giá cho những khách hàng trung thành.|Ananda was loyal to the Buddha and served him for twenty-five years.|A-nan trung thành với Đức Phật và hầu cận Ngài hai mươi lăm năm.|Đi với to: loyal TO sb. Cùng nghĩa faithful. Danh từ: loyalty.", "spouse|spousal (adj.) thuộc vợ chồng|your spouse or partner = vợ/chồng hoặc bạn đời; a supportive spouse = người bạn đời luôn ủng hộ|Please write the name of your spouse on the form.|Vui lòng ghi tên vợ hoặc chồng của bạn vào tờ khai.|The Buddha taught that each spouse has duties towards the other.|Đức Phật dạy rằng vợ và chồng đều có bổn phận đối với nhau.|Từ trung tính, dùng cho cả vợ và chồng, hay gặp trong văn bản hành chính. Văn nói dùng husband, wife hoặc partner.", "responsible|responsibility (n.) trách nhiệm; responsibly (adv.) có trách nhiệm; irresponsible (adj.) vô trách nhiệm|responsible for (doing) sth = chịu trách nhiệm về; hold sb responsible = bắt ai chịu trách nhiệm|Who is responsible for this mess?|Ai chịu trách nhiệm cho đống bừa bộn này?|According to the law of karma, we are responsible for our own actions.|Theo luật nghiệp báo, chúng ta chịu trách nhiệm về hành động của chính mình.|response (đáp lại) + -ible: người có thể \"đáp lại\" cho việc mình làm. Giới từ: responsible FOR.", "stable|stability (n.) sự ổn định; stably (adv.) một cách ổn định; unstable (adj.) bất ổn; stabilize (v.) làm ổn định|a stable job/income = công việc/thu nhập ổn định; stable condition = tình trạng ổn định (y tế)|After the operation, the patient is in a stable condition.|Sau ca mổ, bệnh nhân đang trong tình trạng ổn định.|A stable mind is like a deep lake that wind cannot disturb.|Tâm vững như hồ sâu, gió không làm xao động.|stable (adj.) → stability (n.) → stably (adv.). Danh từ \"stable\" còn có nghĩa là chuồng ngựa.", "expanded|expand (v.) mở rộng; expansion (n.) sự mở rộng; expansive (adj.) rộng lớn|expanded rapidly = mở rộng nhanh chóng; expanded version = bản mở rộng|The airport was expanded to handle more flights.|Sân bay được mở rộng để đón nhiều chuyến bay hơn.|Through practice, her heart expanded to include even people she disliked.|Nhờ tu tập, trái tim cô rộng mở để bao dung cả những người cô không ưa.|ex- (ra ngoài) + pand (dang rộng). Danh từ expansion. Gần nghĩa: grow, extend, widen.", "betray|betrayal (n.) sự phản bội; traitor (n.) kẻ phản bội|betray sb's trust = phản bội lòng tin; betray your country/friends = phản bội đất nước/bạn bè; betray your feelings = để lộ cảm xúc|His shaking hands betray how nervous he is.|Đôi tay run rẩy để lộ anh ấy lo lắng đến mức nào.|Devadatta tried to betray the Buddha and take control of the Sangha.|Đề-bà-đạt-đa tìm cách phản bội Đức Phật và nắm quyền lãnh đạo Tăng đoàn.|Nghĩa thứ hai thú vị: \"để lộ ra\" (betray your feelings). betray → betrayal.", "betrayal|betray (v.) phản bội; traitor (n.) kẻ phản bội|a sense of betrayal = cảm giác bị phản bội; an act of betrayal = hành động phản bội|Many fans saw the player's move to the rival team as a betrayal.|Nhiều cổ động viên coi việc cầu thủ chuyển sang đội đối thủ là sự phản bội.|Forgiving a betrayal does not mean forgetting it; it means letting go of hatred.|Tha thứ cho sự phản bội không có nghĩa là quên; mà là buông bỏ hận thù.|betray + -al (danh từ, như arrive → arrival, refuse → refusal).", "obligation|oblige (v.) bắt buộc; obliges (v.) bắt buộc; obligatory (adj.) bắt buộc|a moral/legal obligation = nghĩa vụ đạo đức/pháp lý; be under no obligation to = không bắt buộc phải|You are under no obligation to buy anything.|Bạn không bắt buộc phải mua gì cả.|Children in Vietnam feel a strong obligation to care for their parents.|Con cái ở Việt Nam cảm thấy có bổn phận lớn phải chăm sóc cha mẹ.|oblige → obligation. \"Under no obligation\" nghĩa là không bắt buộc, câu hay gặp trong quảng cáo.", "prevent|prevention (n.) sự phòng ngừa; preventive (adj.) phòng ngừa|prevent sb/sth from doing sth = ngăn ai/cái gì làm gì; prevent accidents/disease = phòng tránh tai nạn/bệnh|Nothing can prevent her from following her dream.|Không gì có thể ngăn cô theo đuổi ước mơ.|Mindfulness can prevent small irritations from turning into anger.|Chánh niệm có thể ngăn những bực bội nhỏ biến thành cơn giận.|Cấu trúc: prevent sb FROM V-ing. \"Phòng bệnh hơn chữa bệnh\" là Prevention is better than cure.", "noble|nobility (n.) sự cao quý, giới quý tộc; nobly (adv.) một cách cao quý; nobleman (n.) nhà quý tộc|the Four Noble Truths = Tứ Diệu Đế; the Noble Eightfold Path = Bát Chánh Đạo; a noble cause = mục đích cao cả|She was born into a noble family in the 18th century.|Bà sinh ra trong một gia đình quý tộc vào thế kỷ 18.|The Noble Eightfold Path begins with right view.|Bát Chánh Đạo bắt đầu bằng chánh kiến.|Trong kinh tiếng Anh, noble mang nghĩa \"thánh, diệu\": Four Noble Truths (Tứ Thánh Đế), Noble Eightfold Path (Bát Thánh Đạo).", "sentiment|sentimental (adj.) đa cảm; sentient (adj.) có tri giác (cùng gốc)|public sentiment = dư luận công chúng; I share your sentiments = tôi cũng nghĩ như bạn|Public sentiment turned against the plan after the accident.|Dư luận quay sang phản đối kế hoạch sau vụ tai nạn.|There is a lot of sentiment attached to the old village pagoda.|Ngôi chùa làng cũ chất chứa biết bao tình cảm.|Cùng gốc sentire (cảm nhận) với sentient. Tính từ sentimental là ủy mị, đa cảm: a sentimental song.", "obliges|oblige (v.) bắt buộc; obligation (n.) nghĩa vụ; obliged (adj.) biết ơn; buộc phải|obliges sb to do sth = buộc ai làm gì; I'm much obliged = tôi rất biết ơn (trang trọng)|The contract obliges the company to pay within thirty days.|Hợp đồng buộc công ty thanh toán trong vòng ba mươi ngày.|Taking the Bodhisattva vow obliges you to keep helping others.|Phát nguyện Bồ-tát buộc bạn phải luôn giúp đỡ người khác.|Cấu trúc: oblige sb TO do sth. \"Much obliged\" nghĩa là cảm ơn rất nhiều (cũ, trang trọng).", "morally|moral (adj./n.) thuộc đạo đức; bài học; morality (n.) đạo đức|morally wrong/right = sai/đúng về đạo đức; morally responsible = có trách nhiệm đạo đức|Is it morally acceptable to test medicines on animals?|Thử nghiệm thuốc trên động vật có chấp nhận được về mặt đạo đức không?|Right speech means speaking in a way that is truthful and morally sound.|Chánh ngữ nghĩa là nói năng chân thật và đúng đắn về đạo đức.|moral + -ly. Hay đi với tính từ: morally wrong, morally responsible.", "faithfully|faith (n.) niềm tin, đức tin; faithful (adj.) trung thành; faithfulness (n.) lòng trung thành|Yours faithfully = Kính thư (thư trang trọng, không biết tên người nhận); serve faithfully = phục vụ trung thành|End a formal letter with \"Yours faithfully\" when you start with \"Dear Sir or Madam\".|Kết thư bằng \"Yours faithfully\" khi mở đầu bằng \"Dear Sir or Madam\".|She has faithfully kept the five precepts since she was twenty.|Bà đã giữ năm giới một cách trung thành từ năm hai mươi tuổi.|Cặp đôi thư từ (Anh-Anh): Dear Sir/Madam đi với Yours faithfully; Dear + tên người nhận đi với Yours sincerely.", "solidarity|solid (adj.) rắn chắc, vững; solidly (adv.) vững chắc|show solidarity with = thể hiện tình đoàn kết với; in solidarity with = đoàn kết cùng; a sense of solidarity = tinh thần đoàn kết|Workers went on strike in solidarity with their colleagues.|Công nhân đình công để đoàn kết với đồng nghiệp.|Buddhist temples showed their solidarity by cooking free meals for flood victims.|Các chùa thể hiện tình đoàn kết bằng việc nấu cơm miễn phí cho nạn nhân lũ lụt.|solid (vững chắc) + -arity: mọi người gắn chặt như một khối rắn. Giới từ: solidarity WITH sb.", "discipline|disciplined (adj.) có kỷ luật; disciple (n.) đệ tử (cùng gốc \"học\"); self-discipline (n.) tính tự giác|self-discipline = tính tự giác; strict discipline = kỷ luật nghiêm; monastic discipline = giới luật tu viện|Working from home requires a lot of self-discipline.|Làm việc tại nhà đòi hỏi rất nhiều tính tự giác.|The Vinaya is the book of monastic discipline.|Luật tạng là bộ sách về giới luật của tu sĩ.|Cùng gốc disciple (đệ tử) từ Latin discere là học. Kỷ luật ban đầu nghĩa là \"sự rèn luyện của người học trò\".", "trustworthiness|trust (n./v.) lòng tin; trustworthy (adj.) đáng tin; entrust (v.) giao phó|prove your trustworthiness = chứng tỏ mình đáng tin|Online shops show customer reviews to prove their trustworthiness.|Các cửa hàng trực tuyến hiển thị đánh giá của khách để chứng minh độ tin cậy.|A monk's trustworthiness is built through years of pure conduct.|Sự đáng tin của một vị sư được xây dựng qua nhiều năm giới hạnh trong sạch.|trust + worthy (xứng đáng) + -ness = sự xứng đáng được tin. Dài nhưng dễ tách: trust · worthi · ness.", "contribute|contribution (n.) sự đóng góp; contributor (n.) người đóng góp|contribute to = đóng góp vào, góp phần gây ra; contribute money/ideas = đóng góp tiền/ý tưởng|Stress can contribute to heart disease.|Căng thẳng có thể góp phần gây bệnh tim.|Each member was asked to contribute a little rice for the poor.|Mỗi thành viên được đề nghị góp một ít gạo cho người nghèo.|con- (cùng) + tribute (trao) = cùng trao vào. Lưu ý: contribute TO còn có nghĩa tiêu cực \"góp phần gây ra\".", "violently|violent (adj.) bạo lực; violence (n.) bạo lực|react violently = phản ứng dữ dội; shake violently = rung lắc dữ dội|The man reacted violently when the police tried to stop him.|Người đàn ông phản ứng dữ dội khi cảnh sát cố ngăn anh ta.|Even when he was treated violently, the monk did not respond with anger.|Ngay cả khi bị đối xử thô bạo, vị sư cũng không đáp lại bằng sân hận.|violent → violently. Đừng nhầm với violation (vi phạm). Bất bạo động là non-violence.", "scold|scolding (n.) lời mắng|scold sb for (doing) sth = mắng ai vì|My mother used to scold me for coming home late.|Mẹ tôi hay mắng tôi vì về nhà muộn.|The old monk did not scold the novice, but quietly showed him how to sweep properly.|Sư già không mắng chú tiểu mà lặng lẽ chỉ cho chú cách quét cho đúng.|Cấu trúc: scold sb FOR sth. Gần nghĩa: tell off (văn nói). Thường dùng với trẻ con.", "insult|insulting (adj.) xúc phạm; insulted (adj.) cảm thấy bị xúc phạm|add insult to injury = đã đau còn thêm đau; take sth as an insult = coi điều gì là xúc phạm|Please don't take my advice as an insult.|Xin đừng coi lời khuyên của tôi là sự xúc phạm.|When a man came to insult the Buddha, he calmly refused to accept the \"gift\" of anger.|Khi một người đến lăng mạ Đức Phật, Ngài điềm tĩnh không nhận \"món quà\" sân hận ấy.|Danh từ nhấn âm đầu /ˈɪn.sʌlt/, động từ nhấn âm sau /ɪnˈsʌlt/. Thành ngữ: add insult to injury.", "threatening|threat (n.) mối đe dọa; threaten (v.) đe dọa|a threatening letter/message = thư/tin nhắn đe dọa; threatening behaviour = hành vi đe dọa; a threatening sky = bầu trời u ám|Dark, threatening clouds gathered over the hills.|Những đám mây đen u ám kéo đến trên đồi.|The angry elephant came towards the Buddha in a threatening way, but became calm before him.|Con voi say cuồng lao về phía Đức Phật đầy đe dọa, nhưng trở nên hiền lành trước Ngài.|threat (n.) → threaten (v.) → threatening (adj.). Đọc /ˈθret.ən.ɪŋ/, chữ \"ea\" đọc như \"e\".", "moral|morality (n.) đạo đức; morally (adv.) về mặt đạo đức; morale (n.) tinh thần (khác nghĩa)|the moral of the story = bài học của câu chuyện; moral values/duty = giá trị/bổn phận đạo đức; moral support = sự ủng hộ tinh thần|My friends came to the hospital to give me moral support.|Bạn bè đến bệnh viện để động viên tinh thần tôi.|Jataka tales were told to teach moral lessons to ordinary people.|Truyện Bổn Sanh được kể để dạy bài học đạo đức cho người bình thường.|Đừng nhầm: moral /ˈmɒr.əl/ (đạo đức) và morale /məˈrɑːl/ (tinh thần, sĩ khí: team morale).", "worthy|worth (n./adj.) giá trị; trustworthy (adj.) đáng tin; unworthy (adj.) không xứng đáng|worthy of sth = xứng đáng với; a worthy cause = mục đích chính đáng|The money will go to a worthy cause.|Số tiền sẽ được dùng cho một mục đích chính đáng.|The Buddha said that people become worthy not by birth but by their actions.|Đức Phật dạy rằng con người trở nên cao quý không phải do dòng dõi mà do hành động.|worth + -y. Đi với of: worthy OF respect. Hậu tố -worthy: trustworthy, newsworthy (đáng đưa tin).", "cheat|cheater (n.) kẻ gian lận; cheating (n.) sự gian lận|cheat in an exam = gian lận thi cử; cheat sb out of sth = lừa ai lấy mất cái gì; cheat on sb = ngoại tình|The shopkeeper tried to cheat tourists by charging double.|Người bán hàng tìm cách lừa du khách bằng cách tính giá gấp đôi.|A Buddhist trader should never cheat customers with false weights.|Một thương nhân Phật tử không bao giờ được lừa khách bằng cân gian.|Lưu ý giới từ: \"cheat on sb\" là ngoại tình, \"cheat in an exam\" là quay cóp.", "harms|harm (n./v.) sự tổn hại; gây hại; harmful (adj.) có hại; harmless (adj.) vô hại; harmfulness (n.) tác hại|harms the environment/health = gây hại cho môi trường/sức khỏe; do more harm than good = hại nhiều hơn lợi|Too much screen time harms children's sleep.|Dùng màn hình quá nhiều gây hại cho giấc ngủ của trẻ.|Anyone who harms another being also harms himself, the sutra says.|Kinh nói ai làm hại chúng sinh khác cũng là tự làm hại mình.|harm + -ful (có hại) hoặc -less (vô hại). Thành ngữ: \"No harm done\" là không sao đâu.", "joyful|joy (n.) niềm vui; joyfully (adv.) vui vẻ; enjoy (v.) thưởng thức|a joyful occasion/celebration = dịp/lễ vui; joyful news = tin vui|Their wedding was a joyful celebration for ơi sáng là đặc trưng trong tranh của ông.|Impermanence is a characteristic of everything that exists.|Vô thường là đặc tính của mọi thứ đang tồn tại.|Vừa là danh từ (đặc điểm) vừa là tính từ (đặc trưng). \"Tam pháp ấn\" là the three characteristics: vô thường, khổ, vô ngã.", "addictive|addict (n.) người nghiện; addicted (adj.) bị nghiện; addiction (n.) sự nghiện|highly addictive = gây nghiện mạnh; addictive substances = chất gây nghiện|This game is so addictive that I played until 2 a.m.|Trò chơi này gây nghiện đến mức tôi chơi tới 2 giờ sáng.|The Buddha warned that craving for pleasure is addictive and never truly satisfies.|Đức Phật cảnh báo lòng ham muốn khoái lạc dễ gây nghiện và không bao giờ thật sự thỏa mãn.|Phân biệt họ addict: addictive (thứ gây nghiện), addicted (người bị nghiện), addict (danh từ: người nghiện), addiction (sự nghiện).", "alcohol|alcoholic (adj./n.) có cồn; người nghiện rượu; alcoholism (n.) chứng nghiện rượu|alcohol-free = không cồn; drink alcohol = uống rượu bia; alcohol abuse = lạm dụng rượu|Many young people now choose alcohol-free drinks at parties.|Nhiều bạn trẻ giờ chọn đồ uống không cồn ở các bữa tiệc.|At the retreat, alcohol and cigarettes are not allowed.|Trong khóa tu, không được dùng rượu bia và thuốc lá.|Đọc /ˈæl.kə.hɒl/, chữ \"h\" vẫn phát âm. Gốc Ả Rập al-kuhl.", "drug|drugstore (n.) hiệu thuốc (Mỹ); drug addict (n.) người nghiện ma túy|take drugs = dùng ma túy; drug abuse = lạm dụng ma túy; a new drug = loại thuốc mới|Scientists are testing a new drug for cancer.|Các nhà khoa học đang thử nghiệm loại thuốc mới chữa ung thư.|The temple runs a drug rehabilitation centre in the mountains.|Ngôi chùa điều hành một trung tâm cai nghiện ma túy trên núi.|Hai nghĩa: thuốc chữa bệnh (medicine) và ma túy. Văn cảnh quyết định nghĩa.", "unaware|aware (adj.) nhận thức; awareness (n.) sự nhận thức|unaware of sth = không biết về; blissfully unaware = vô tư không hay biết gì|He was unaware of the danger until it was too late.|Anh ấy không hề
