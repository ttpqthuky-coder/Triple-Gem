<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<title>Hoa Sen Từ Vựng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Gentium+Book+Plus&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap">
<style>
/* Layout: one-screen phone app. Slim top bar, scrolling view, five-tab bottom bar; study mode hides the chrome and centres each card on a saffron halo medallion. */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#E3E9E3; --ink:#1A231F; --muted:#59665F; --line:#D2DAD3;
  --accent:#B0611A; --accent-soft:#F5E2CB; --on-accent:#FFFFFF;
  --lotus:#AE4A6E; --jade:#2C7559; --again:#B13F37; --hard:#86682A; --new:#2F6C9A;
  --halo-core:#FFF5E2; --halo-edge:#F1D3A6; --ray:rgba(176,97,26,.16); --scrim:rgba(10,16,14,.45);
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-ipa:"Gentium Book Plus", "Charis SIL", "Doulos SIL", "Noto Serif", "Segoe UI", serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#17201D; --surface-2:#1F2A26; --ink:#E5ECE8; --muted:#93A29A; --line:#2A3732;
  --accent:#E59C4E; --accent-soft:#3A2916; --on-accent:#1B1207;
  --lotus:#E583A6; --jade:#5DBF96; --again:#E8705F; --hard:#D5B062; --new:#74AEDB;
  --halo-core:#3C2C17; --halo-edge:#21190F; --ray:rgba(229,156,78,.14); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#17201D; --surface-2:#1F2A26; --ink:#E5ECE8; --muted:#93A29A; --line:#2A3732;
  --accent:#E59C4E; --accent-soft:#3A2916; --on-accent:#1B1207;
  --lotus:#E583A6; --jade:#5DBF96; --again:#E8705F; --hard:#D5B062; --new:#74AEDB;
  --halo-core:#3C2C17; --halo-edge:#21190F; --ray:rgba(229,156,78,.14); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:12px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.01em}
.brand svg{width:28px;height:28px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:8px 28px;-webkit-overflow-scrolling:touch}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
body.studying nav.tabs,body.studying header.top{display:none}

h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
h2{font-size:21px}
h3{font-size:17px}
.eyebrow,.ilabel{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:600;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.slow{width:auto;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600}
.icon-btn.mic{color:var(--lotus)}
.icon-btn.mic.listening{background:var(--lotus);color:var(--on-accent);border-color:var(--lotus);animation:pulse 1.2s ease-in-out infinite}
.icon-btn.mic.processing{opacity:.6}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lotus) 45%,transparent)}50%{box-shadow:0 0 0 10px transparent}}

/* Home */
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:4px 14px}
.today .num{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.today .lbl{font-size:13px;color:var(--muted);margin-top:4px}
.num.due{color:var(--jade)} .num.nw{color:var(--new)}
.hero{position:relative;overflow:hidden}
.hero .halo-bg{position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--halo-core),var(--halo-edge) 60%,transparent 61%);opacity:.7;pointer-events:none}
.hero > *{position:relative}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:10px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font-weight:600}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats3 .v{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stats3 .k{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lesson{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lesson .t{font-weight:600}
.lesson .r{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.mini span{display:block;height:100%;background:var(--jade)}
.rowsb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Study */
.sbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.sbar .counts{display:flex;gap:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.c-new{color:var(--new)} .c-learn{color:var(--again)} .c-rev{color:var(--jade)}
.sprog{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:8px}
.sprog span{display:block;height:100%;background:var(--accent);transition:width .3s}
.qwrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:8px 16px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.chip.newc{background:transparent;border:1px solid var(--new);color:var(--new)}
.word{font-family:var(--f-display);font-size:clamp(32px,9vw,44px);font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.ipa{font-family:var(--f-ipa);font-size:20px;color:var(--muted)}
.pos{font-style:italic;color:var(--muted);font-size:14px}
.meaning{font-size:21px;font-weight:600;color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.scene{font-size:13.5px;color:var(--muted);font-style:italic;max-width:32ch}

.medal{position:relative;width:min(172px,46vw);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 46%,var(--halo-core) 0%,var(--halo-core) 38%,var(--halo-edge) 70%);box-shadow:0 0 0 1px var(--line) inset}
.medal .rays{position:absolute;inset:-14%;border-radius:50%;background:repeating-conic-gradient(var(--ray) 0deg 3deg,transparent 3deg 15deg);-webkit-mask:radial-gradient(circle,transparent 46%,#000 47%,transparent 70%);mask:radial-gradient(circle,transparent 46%,#000 47%,transparent 70%);animation:spin 80s linear infinite;pointer-events:none}
.medal .e1{font-size:calc(min(172px,46vw)*.44);line-height:1}
.medal .e2,.medal .e3{position:absolute;font-size:calc(min(172px,46vw)*.2);line-height:1;width:34%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.medal .e2{right:-4%;bottom:2%}
.medal .e3{left:-4%;top:2%}
.medal .flow{display:flex;align-items:center;gap:4px;font-size:calc(min(172px,46vw)*.24)}
.medal .flow .ar{font-size:.55em;color:var(--accent)}
.medal.sm{width:96px}
.medal.sm .e1{font-size:42px}.medal.sm .e2,.medal.sm .e3{font-size:18px}.medal.sm .flow{font-size:22px}
@keyframes spin{to{transform:rotate(360deg)}}

.listen-big,.mic-big{width:120px;height:120px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 10px var(--accent-soft)}
.listen-big svg,.mic-big svg{width:48px;height:48px}
.mic-big{background:var(--lotus);box-shadow:0 0 0 10px color-mix(in srgb,var(--lotus) 18%,transparent);align-content:center;gap:2px}
.mic-big span{font-size:12px;font-weight:600}
.mic-big.listening{animation:pulse 1.2s ease-in-out infinite}
.cloze{font-family:var(--f-display);font-size:20px;line-height:1.55;max-width:34ch}
.blank{display:inline-block;min-width:4.5ch;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:600;padding:0 4px}
.trans{color:var(--muted);font-size:14.5px;max-width:38ch}
.choices{display:grid;gap:10px;width:100%}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:500}
.choice.ok{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 12%,var(--surface))}
.choice.bad{border-color:var(--again);background:color-mix(in srgb,var(--again) 12%,var(--surface))}
.choice:disabled{cursor:default}
.spell{display:flex;gap:8px;width:100%}
.spell input{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.spell input.ok{border-color:var(--jade)} .spell input.bad{border-color:var(--again)}
.verdict{font-weight:600}
.verdict.ok,.v.ok{color:var(--jade)} .verdict.bad,.v.bad{color:var(--again)}
.hintline{font-family:var(--f-ipa);font-size:22px;letter-spacing:.2em;color:var(--accent)}

/* scramble */
.scr-line{width:100%;min-height:62px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:12px;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface)}
.scr-line.ok{border-style:solid;border-color:var(--jade)} .scr-line.bad{border-style:solid;border-color:var(--again)}
.scr-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.tok{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 11px;font-family:var(--f-display);font-size:16.5px}
.scr-line .tok{background:var(--accent-soft);border-color:transparent}
.tok.good{background:color-mix(in srgb,var(--jade) 18%,var(--surface));color:var(--ink)}
.tok.wrong{background:color-mix(in srgb,var(--again) 18%,var(--surface));color:var(--ink)}
.suffix{font-family:var(--f-display);font-size:18px}
.correct-s{font-family:var(--f-display);font-size:17px;max-width:36ch}

.answer{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.example{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.example .extabs{grid-column:1/-1;display:flex;gap:6px;margin-bottom:2px}
.extabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.extabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.example .en{font-family:var(--f-display);font-size:17px;line-height:1.5}
.example mark{background:transparent;color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent-soft)}
.example .vi{grid-column:1/-1;color:var(--muted);font-size:14px}
.example .exbtns{display:flex;flex-direction:column;gap:6px}
.example .micres{grid-column:1/-1}
.micres:empty{display:none}
.micres{font-size:13.5px;text-align:left;width:100%;background:var(--surface-2);border-radius:10px;padding:8px 12px}
.micres .sent{font-family:var(--f-display);font-size:16px;line-height:1.6;margin-bottom:2px}
.micres .hit{color:var(--jade);font-weight:600}
.micres .miss{color:var(--again);text-decoration:underline wavy;text-underline-offset:3px}
.micres .heard{color:var(--muted)}
.ldot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lotus);margin-right:6px;animation:pulse 1.2s infinite}
.infos{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.info .ilabel{margin-bottom:6px}
.colloc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.colloc li{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.linkish{border:0;background:none;padding:0;font-family:var(--f-display);font-size:15.5px;font-weight:600;color:var(--ink);text-align:left;border-bottom:1px dotted var(--muted)}
.colloc span{color:var(--muted);font-size:13.5px}
.fam{display:flex;flex-direction:column;gap:4px;font-size:14px}
.fam i{color:var(--muted)}
.famlink{border:0;background:none;padding:0;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-size:14px}
.tip svg{width:22px;height:22px;color:var(--accent);margin-top:2px}
.rate{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:10px 4px;background:linear-gradient(transparent,var(--bg) 18%)}
.rate.three{grid-template-columns:repeat(3,1fr)}
.rate button{border:0;border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;color:#fff}
.rate button small{font-weight:500;font-size:11.5px;opacity:.92}
.rate .r1{background:var(--again)} .rate .r2{background:var(--hard)} .rate .r3{background:var(--jade)} .rate .r4{background:var(--new)}
:root[data-theme="dark"] .rate button{color:#0F1614}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rate button{color:#0F1614}}
.rate button.suggest{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}
.reveal-btn{position:sticky;bottom:0;padding-block:10px 4px;background:linear-gradient(transparent,var(--bg) 18%);width:100%}
.step{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:28px}

/* Practice */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard p{margin:0;color:var(--muted);font-size:14px}
.pcard .btn{margin-top:auto;align-self:flex-start}
.picon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.picon svg{width:22px;height:22px}
select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.hfcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.hfctl{display:flex;justify-content:center;gap:18px;align-items:center}
.hfctl .play{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.hfctl .play svg{width:34px;height:34px}
.hfctl .icon-btn{width:52px;height:52px}
.hfex{font-family:var(--f-display);font-size:16.5px}
.affix .ahead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.affix .aff{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--accent)}
.affix .ad{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.achips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.achips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:13.5px}

/* Stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .v{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-size:12.5px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:84px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.hbar .tr{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.hbar .tr span{display:block;height:100%;background:var(--jade)}
.hbar b{text-align:right}
.hard-list{display:flex;flex-direction:column}
.hard-list button{display:flex;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 0;text-align:left}
.hard-list button:last-child{border-bottom:0}
.lg{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Words */
.search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.wrow:last-child{border-bottom:0}
.wrow .em{font-size:24px;width:32px;text-align:center}
.wrow .w{font-weight:600;font-family:var(--f-display);font-size:16.5px}
.wrow .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .st{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}

.sheet-bg{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 10px}

/* Settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set label{font-weight:500}
.set .sub{font-size:12.5px;color:var(--muted);font-weight:400}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.switch{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--surface-2);position:relative;border:1px solid var(--line);flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px);background:var(--on-accent)}
input[type=range]{accent-color:var(--accent);width:130px}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.prose p{margin:0 0 8px}
.prose ol{margin:0;padding-left:20px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){.medal .rays,.icon-btn.mic.listening,.mic-big.listening,.ldot{animation:none}.sprog span,.switch::after{transition:none}}
</style>

<script>
const LINES = ["homage|/ˈhɒmɪdʒ/|sự tôn kính|n.|🙇🛕|một người cúi đầu trước tượng Phật|Thousands of pilgrims visit the temple every year to pay homage to the Buddha.|Hàng nghìn người hành hương đến chùa mỗi năm để bày tỏ lòng tôn kính Đức Phật.", "devoted|/dɪˈvəʊtɪd/|tận tụy, hết lòng|adj.|🙏📿|một người chăm chỉ cầu nguyện|My grandmother is a devoted Buddhist who chants every morning before breakfast.|Bà tôi là một Phật tử tận tụy, sáng nào cũng tụng kinh trước bữa sáng.", "revered|/rɪˈvɪəd/|được kính trọng|adj.|🧘‍♂️🙇|một vị sư được mọi người cúi chào|The old monk is revered by everyone in the village for his kindness.|Vị sư già được mọi người trong làng kính trọng vì lòng tốt của ngài.", "bestow|/bɪˈstəʊ/|ban tặng, trao tặng|v.|🎁💐|một vị thầy trao vòng hoa cho đệ tử|The master decided to bestow his old robe on his most faithful student.|Vị thầy quyết định trao tặng chiếc áo cũ cho người học trò trung thành nhất.", "entrusted|/ɪnˈtrʌstɪd/|được giao phó|v.|📜🤝|một người nhận cuộn giấy nhiệm vụ|She was entrusted with the task of organizing the temple's charity event.|Cô ấy được giao phó nhiệm vụ tổ chức sự kiện từ thiện của chùa.", "sacred|/ˈseɪkrɪd/|thiêng liêng|adj.|🛕✨|ngôi chùa tỏa ánh sáng vàng|For many Buddhists, Bodh Gaya is the most sacred place in the world.|Với nhiều Phật tử, Bồ Đề Đạo Tràng là nơi thiêng liêng nhất thế giới.", "reverence|/ˈrevərəns/|sự kính trọng, tôn kính|n.|🧎🪷|người quỳ trước bàn thờ Phật|The visitors spoke quietly out of reverence for the holy place.|Du khách nói khẽ vì lòng tôn kính đối với nơi linh thiêng.", "earnestly|/ˈɜːnɪstli/|một cách thành khẩn|adv.|🙏😌|khuôn mặt nghiêm trang khi cầu nguyện|He prayed earnestly for his mother's quick recovery.|Anh ấy thành khẩn cầu nguyện cho mẹ mau bình phục.", "compassionately|/kəmˈpæʃənətli/|một cách từ bi|adv.|🤲🧒|bàn tay dịu dàng xoa đầu trẻ|The nurse spoke compassionately to the frightened child.|Cô y tá nói chuyện đầy từ bi với đứa trẻ đang sợ hãi.", "boundless|/ˈbaʊndləs/|vô hạn, bao la|adj.|🌌💙|bầu trời xanh không biên giới|A mother's love for her children seems boundless.|Tình yêu của mẹ dành cho con dường như là vô hạn.", "purify|/ˈpjʊərɪfaɪ/|làm thanh tịnh, thanh lọc|v.|💧🪨|dòng nước trong chảy qua đá|Meditation can help us purify the mind of anger and greed.|Thiền định có thể giúp ta thanh lọc tâm khỏi sân hận và tham lam.", "misdeeds|/ˌmɪsˈdiːdz/|hành vi sai trái|n.|🌑➡️☀️|bóng tối tan biến dưới ánh sáng|He sincerely regretted the misdeeds of his youth.|Anh ấy thật lòng hối hận về những việc làm sai trái thời trẻ.", "wholesome|/ˈhəʊlsəm/|lành mạnh|adj.|🥗🥦|một bữa ăn chay đầy màu sắc|A vegetarian diet can be both delicious and wholesome.|Chế độ ăn chay có thể vừa ngon vừa lành mạnh.", "merit|/ˈmerɪt/|công đức|n.|✨🤲|ánh sáng phát ra từ việc làm thiện|Buddhists believe that helping others creates merit.|Phật tử tin rằng giúp đỡ người khác tạo ra công đức.", "virtuous|/ˈvɜːtʃuəs/|đức hạnh|adj.|😇🍞|một người giúp đỡ người nghèo|She lived a simple and virtuous life, always helping the poor.|Bà sống một cuộc đời giản dị và đức hạnh, luôn giúp đỡ người nghèo.", "Bodhicitta|/ˌbəʊdɪˈtʃɪtə/|tâm Bồ-đề (tâm Bồ-tát)|n.|💛🌟|trái tim tỏa sáng lòng từ bi|Bodhicitta is the wish to become enlightened in order to help all beings.|Tâm Bồ-đề là ước nguyện giác ngộ để giúp đỡ tất cả chúng sinh.", "diligent|/ˈdɪlɪdʒənt/|chăm chỉ, siêng năng|adj.|👨‍🌾🌅|người cày ruộng dưới nắng sớm|A diligent student reviews her notes every evening.|Một học sinh siêng năng ôn lại bài mỗi tối.", "cultivation|/ˌkʌltɪˈveɪʃn/|sự tu tập, vun bồi|n.|🌱🌳|cây xanh mọc trên đất tốt|The cultivation of patience takes many years of practice.|Việc tu dưỡng lòng kiên nhẫn cần nhiều năm luyện tập.", "meditative|/ˈmedɪtətɪv/|trầm tư, thuộc thiền định|adj.|🧘🌳|người ngồi tĩnh lặng dưới cây|Walking slowly in the garden puts me in a calm, meditative mood.|Đi bộ chậm rãi trong vườn khiến tôi rơi vào tâm trạng bình yên, trầm tĩnh.", "ecstasy|/ˈekstəsi/|trạng thái xuất thần, hỷ lạc|n.|🧘✨|ánh sáng bao quanh người thiền|The monk described a moment of pure ecstasy during deep meditation.|Vị sư kể về một khoảnh khắc hỷ lạc thuần khiết khi thiền sâu.", "enlightenment|/ɪnˈlaɪtnmənt/|sự giác ngộ|n.|🌄☀️|mặt trời mọc trên núi cao|The Buddha attained enlightenment under the Bodhi tree.|Đức Phật đạt giác ngộ dưới cội Bồ-đề.", "radiating|/ˈreɪdieɪtɪŋ/|tỏa ra, tỏa sáng|v.|🕯️✨|ngọn nến chiếu sáng bóng tối|She walked in, radiating warmth and confidence.|Cô ấy bước vào, toả ra sự ấm áp và tự tin.", "halo|/ˈheɪləʊ/|vầng hào quang|n.|😇🟡|ánh sáng quanh đầu tượng Phật|In many paintings, the Buddha is shown with a golden halo around his head.|Trong nhiều bức tranh, Đức Phật được vẽ với vầng hào quang vàng quanh đầu.", "insight|/ˈɪnsaɪt/|sự thấu hiểu, tuệ giác|n.|👁️🌫️|đôi mắt sáng nhìn xuyên màn sương|Her book gives real insight into the life of monks in Tibet.|Cuốn sách của cô mang lại hiểu biết sâu sắc về đời sống tu sĩ ở Tây Tạng.", "kowtow|/ˈkaʊtaʊ/|lạy, khấu đầu|v.|🙇‍♂️🛐|người cúi lạy trước bàn thờ|In the past, visitors had to kowtow before the emperor.|Ngày xưa, khách phải khấu đầu trước nhà vua.", "endless|/ˈendləs/|vô tận, không ngừng|adj.|🏞️♾️|dòng sông chảy mãi không ngừng|The cycle of birth and death can seem endless.|Vòng sinh tử có thể dường như vô tận.", "entrust|/ɪnˈtrʌst/|giao phó|v.|🔑🤝|trao chìa khóa cho người thân tín|I would only entrust my house keys to my closest friend.|Tôi chỉ giao chìa khoá nhà cho người bạn thân nhất.", "wholeheartedly|/ˌhəʊlˈhɑːtɪdli/|hết lòng|adv.|❤️‍🔥💪|trái tim rực cháy nhiệt huyết|The volunteers threw themselves wholeheartedly into the project.|Các tình nguyện viên dốc hết lòng vào dự án.", "transcended|/trænˈsendɪd/|đã vượt lên, vượt qua|v.|🦅🏔️|chim bay qua đỉnh núi cao|Her music transcended language and touched people everywhere.|Âm nhạc của cô vượt qua rào cản ngôn ngữ và chạm đến mọi người khắp nơi.", "samsara|/səmˈsɑːrə/|luân hồi|n.|☸️🔄|bánh xe quay không ngừng|Buddhists hope to escape samsara, the cycle of rebirth.|Phật tử mong thoát khỏi luân hồi, vòn
