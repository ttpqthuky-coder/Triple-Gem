 của tâm.|dim + m + -ing (gấp đôi phụ âm cuối: dim → dimming, như swim → swimming).", "career|careerist (n.) người chạy theo danh vọng|a successful career = sự nghiệp thành công; career path = con đường sự nghiệp; change careers = đổi nghề|She left a successful career in banking to become a teacher.|Cô từ bỏ sự nghiệp thành công trong ngân hàng để trở thành giáo viên.|He had a long career as a doctor before he became a monk.|Ông có một sự nghiệp dài làm bác sĩ trước khi đi tu.|Đọc /kəˈrɪə/ nhấn âm sau, khác carrier /ˈkær.i.ə/. career là sự nghiệp lâu dài; job là công việc cụ thể.", "shortening|short (adj.) ngắn; shorten (v.) rút ngắn; shortage (n.) sự thiếu hụt|the days are shortening = ngày ngắn dần; shortening the process = rút ngắn quy trình|In autumn, the days are shortening and the nights are getting longer.|Mùa thu, ngày ngắn dần còn đêm thì dài ra.|Worry is only shortening your life; it changes nothing.|Lo lắng chỉ rút ngắn cuộc đời bạn; nó chẳng thay đổi được gì.|short → shorten (-en là làm cho) → shortening. Nhóm -en: widen, deepen, lengthen.", "lifespan|life (n.) cuộc sống; live (v.) sống; long-lived (adj.) trường thọ|average lifespan = tuổi thọ trung bình; extend your lifespan = kéo dài tuổi thọ|The average lifespan of a smartphone is about three years.|Tuổi thọ trung bình của điện thoại thông minh khoảng ba năm.|Buddhist texts say that kindness to living beings leads to a long lifespan.|Kinh điển Phật giáo nói lòng từ với chúng sinh đưa đến tuổi thọ dài lâu.|life + span (khoảng, độ dài). Dùng cả cho đồ vật: battery lifespan.", "miserable|misery (n.) nỗi khổ; miserably (adv.) thảm hại|feel miserable = thấy khổ sở; miserable weather = thời tiết tệ hại; fail miserably = thất bại thảm hại|It was cold, wet and miserable weather all week.|Cả tuần thời tiết lạnh, ẩm và tệ hại.|The rich man was miserable because he always wanted more.|Người giàu ấy khổ sở vì lúc nào cũng muốn nhiều hơn.|misery (nỗi khổ) + -able. Thành ngữ: fail miserably là thất bại thảm hại.", "satisfy|satisfaction (n.) sự hài lòng; satisfied (adj.) hài lòng; satisfying (adj.) làm thỏa mãn|satisfy your hunger/curiosity = thỏa mãn cơn đói/sự tò mò; satisfy customers = làm hài lòng khách hàng|A bowl of pho is enough to satisfy my hunger.|Một bát phở là đủ để thỏa cơn đói của tôi.|Chasing desires to satisfy them is like drinking salt water to stop thirst.|Chạy theo dục vọng để thỏa mãn chúng giống như uống nước muối để hết khát.|satis (đủ, tiếng Latin) + -fy (làm cho) = làm cho đủ. \"Biết đủ\" (tri túc) là contentment.", "mentality|mental (adj.) thuộc tinh thần; mentally (adv.) về mặt tinh thần; mind (n.) tâm trí|a winning mentality = tinh thần chiến thắng; a victim mentality = tâm lý nạn nhân; herd mentality = tâm lý bầy đàn|Herd mentality makes people buy things just because others do.|Tâm lý bầy đàn khiến người ta mua đồ chỉ vì người khác mua.|Practising generosity slowly changes a selfish mentality.|Thực hành bố thí dần dần thay đổi lối nghĩ ích kỷ.|mental + -ity. Thường chỉ lối suy nghĩ của một nhóm người hoặc thói quen tư duy.", "mentally ill|mental illness (n.) bệnh tâm thần; mental health (n.) sức khỏe tinh thần|care for the mentally ill = chăm sóc người bệnh tâm thần; mentally ill patients = bệnh nhân tâm thần|The charity provides housing for people who are mentally ill.|Tổ chức từ thiện cung cấp nhà ở cho những người mắc bệnh tâm thần.|Compassion means treating the mentally ill with patience and respect.|Từ bi nghĩa là đối xử với người bệnh tâm thần bằng sự kiên nhẫn và tôn trọng.|Cách nói chuẩn là \"mentally ill\" (trạng từ + tính từ). Ngày nay người ta hay nói \"people with mental illness\" để tôn trọng hơn.", "unhappy|happy (adj.) vui; happiness (n.) hạnh phúc; unhappiness (n.) nỗi bất hạnh|unhappy with/about sth = không hài lòng với; an unhappy childhood = tuổi thơ bất hạnh|Many customers were unhappy about the long delay.|Nhiều khách hàng không hài lòng về sự chậm trễ kéo dài.|The Buddha noticed that even kings and rich people were often unhappy.|Đức Phật nhận thấy ngay cả vua chúa và người giàu cũng thường không hạnh phúc.|un- + happy. Giới từ: unhappy WITH hoặc ABOUT sth. Nhẹ hơn: dissatisfied; mạnh hơn: miserable.", "harmfulness|harm (n./v.) sự tổn hại; harmful (adj.) có hại; harmless (adj.) vô hại; harms (v.) gây hại|the harmfulness of smoking/alcohol = tác hại của thuốc lá/rượu|Doctors keep warning about the harmfulness of sugary drinks.|Các bác sĩ liên tục cảnh báo về tác hại của đồ uống nhiều đường.|Understanding the harmfulness of anger is the first step to letting it go.|Hiểu rõ tác hại của sân hận là bước đầu để buông bỏ nó.|harm + -ful + -ness. Văn nói thường dùng \"the harmful effects of\" thay cho harmfulness.", "uncountable|count (v.) đếm; countable (adj.) đếm được; countless (adj.) vô số|uncountable noun = danh từ không đếm được|\"Advice\" is uncountable, so we say \"some advice\", not \"an advice\".|\"Advice\" là danh từ không đếm được, nên ta nói \"some advice\" chứ không nói \"an advice\".|The grains of sand in the Ganges seem uncountable, so the sutras use them to describe the number of Buddhas.|Hạt cát sông Hằng dường như không đếm được, nên kinh dùng chúng để chỉ số lượng chư Phật.|un- + count + -able. Trong ngữ pháp: uncountable nouns (water, advice, information). Nghĩa \"vô số\" thường dùng countless hơn.", "addicts|addict (n.) người nghiện (số ít); addicted (adj.) bị nghiện; addiction (n.) sự nghiện|drug addicts = người nghiện ma túy; recovering addicts = người đang cai nghiện|My brother and his friends are real football addicts.|Anh tôi và bạn bè là những người nghiện bóng đá thật sự.|The monks teach meditation to recovering addicts at the centre.|Các nhà sư dạy thiền cho những người đang cai nghiện tại trung tâm.|Danh từ addict nhấn âm đầu /ˈæd.ɪkt/; còn addicted nhấn âm hai /əˈdɪk.tɪd/.", "wastes|waste (n./v.) rác; lãng phí; wasteful (adj.) hoang phí|wastes time/money/energy = lãng phí thời gian/tiền/năng lượng; a waste of time = tốn thời gian vô ích|Leaving the air conditioner on all day wastes a lot of electricity.|Để điều hòa chạy cả ngày lãng phí rất nhiều điện.|The teacher said that gossip wastes the precious time we have for practice.|Vị thầy nói chuyện phiếm làm phí thời gian quý báu dành cho tu tập.|Đọc /weɪsts/ (khó: s-t-s liên tiếp). Danh từ \"wastes\" còn nghĩa là chất thải: industrial wastes.", "decrease|decreasing (adj.) giảm dần; increase (v./n.) tăng (trái nghĩa)|decrease by 10% = giảm 10%; a decrease in = sự sụt giảm về|Prices usually decrease after the holiday season.|Giá cả thường giảm sau mùa lễ.|When we let go of attachment, our suffering will decrease.|Khi buông bỏ chấp trước, khổ đau của ta sẽ giảm đi.|Động từ nhấn âm sau /dɪˈkriːs/, danh từ nhấn âm đầu /ˈdiː.kriːs/. Trái nghĩa: increase.", "shorten|short (adj.) ngắn; shortening (v-ing) đang ngắn lại; shortly (adv.) sớm, ngay|shorten a speech/meeting = rút ngắn bài nói/cuộc họp; shorten the distance = rút ngắn khoảng cách|The new bridge will shorten the journey by thirty minutes.|Cây cầu mới sẽ rút ngắn hành trình ba mươi phút.|You can shorten your meditation when you are tired, but try not to skip it.|Bạn có thể rút ngắn thời gian thiền khi mệt, nhưng cố đừng bỏ.|short + -en (làm cho). Đọc /ˈʃɔː.tən/, chữ \"t\" gần như nuốt.", "suffered|suffer (v.) chịu đựng; suffering (n.) khổ đau; sufferer (n.) người mắc bệnh|suffered from = bị (bệnh); suffered a loss/defeat = chịu tổn thất/thất bại|The team suffered a heavy defeat in the final.|Đội bóng chịu thất bại nặng nề trong trận chung kết.|The Buddha saw that all beings have suffered from old age, sickness and death.|Đức Phật thấy rằng mọi chúng sinh đều chịu khổ vì già, bệnh, chết.|Danh từ suffering là \"khổ\" (dukkha) trong Tứ Diệu Đế. suffer FROM + bệnh: suffer from headaches.", "hurting|hurt (v./adj.) làm đau; bị đau; hurtful (adj.) gây tổn thương|my back is hurting = lưng tôi đang đau; hurting sb's feelings = làm tổn thương tình cảm ai|My feet are hurting after the long walk.|Chân tôi đau nhức sau chuyến đi bộ dài.|Right speech means telling the truth without hurting others unnecessarily.|Chánh ngữ là nói sự thật mà không làm tổn thương người khác một cách không cần thiết.|hurt là động từ bất quy tắc: hurt – hurt – hurt. Chủ ngữ có thể là bộ phận cơ thể: My head is hurting.", "improve|improvement (n.) sự cải thiện; improved (adj.) được cải thiện|improve your skills/health = nâng cao kỹ năng/sức khỏe; room for improvement = còn chỗ để cải thiện|The city is planning to improve public transport.|Thành phố đang lên kế hoạch cải thiện giao thông công cộng.|Even ten minutes of daily meditation can improve concentration.|Chỉ mười phút thiền mỗi ngày cũng có thể cải thiện sự tập trung.|Danh từ: improvement. Cụm hay dùng: There is room for improvement (vẫn còn có thể tốt hơn).", "dignity|dignified (adj.) đường hoàng, trang nghiêm; dignitary (n.) chức sắc|human dignity = phẩm giá con người; with dignity = một cách đường hoàng; lose your dignity = mất thể diện|She accepted her defeat with dignity.|Cô đón nhận thất bại một cách đường hoàng.|Treating beggars with dignity is part of true generosity.|Đối xử đàng hoàng với người ăn xin là một phần của lòng bố thí chân chính.|Gốc Latin dignus là xứng đáng. Tính từ dignified là đường hoàng, trang nghiêm.", "gene|genes (n.) các gen; genetic (adj.) thuộc di truyền; genetics (n.) di truyền học|genes are passed on = gen được di truyền; the gene for = gen quy định|Some people have a gene that makes broccoli taste very bitter.|Một số người có gen khiến bông cải xanh có vị rất đắng.|Your eye colour may come from a gene, but your kindness comes from practice.|Màu mắt có thể do gen quy định, nhưng lòng tốt đến từ sự tu tập.|Đọc /dʒiːn/ giống jeans. Tính từ: genetic (di truyền).", "intelligence|intelligent (adj.) thông minh; intelligently (adv.) một cách thông minh|artificial intelligence (AI) = trí tuệ nhân tạo; emotional intelligence = trí tuệ cảm xúc|Artificial intelligence is changing the way we work.|Trí tuệ nhân tạo đang thay đổi cách chúng ta làm việc.|In Buddhism, intelligence is not the same as wisdom; wisdom also needs a good heart.|Trong đạo Phật, thông minh không giống trí tuệ; trí tuệ còn cần một tấm lòng tốt.|Phân biệt: intelligence là khả năng tư duy nhanh; wisdom là hiểu biết sâu sắc về cuộc sống. AI là Artificial Intelligence.", "indulging|indulge (v.) chiều chuộng, đắm chìm; indulgence (n.) sự nuông chiều; indulgent (adj.) nuông chiều|indulging in sth = đắm chìm, tự thưởng; indulging a child = chiều con|She is always indulging her son with expensive toys.|Cô ấy lúc nào cũng chiều con trai bằng đồ chơi đắt tiền.|The Middle Way avoids both indulging in pleasure and torturing the body.|Trung đạo tránh cả việc đắm chìm trong dục lạc lẫn hành hạ thân xác.|indulge IN sth là cho phép mình hưởng thụ. Trung đạo tránh hai cực đoan: self-indulgence (dục lạc) và self-mortification (khổ hạnh).", "intoxicants|intoxicate (v.) làm say; intoxicated (adj.) say xỉn; toxic (adj.) độc hại|alcohol and other intoxicants = rượu và các chất gây say khác|The sign says that intoxicants are not allowed in the stadium.|Biển báo ghi rằng không được mang chất kích thích vào sân vận động.|The fifth precept is to refrain from intoxicants that cause heedlessness.|Giới thứ năm là tránh các chất gây say dẫn đến buông lung.|in- (vào) + toxic (độc) = đưa chất độc vào người. Giới thứ năm: không dùng chất say (intoxicants).", "pledge|pledged (adj.) đã cam kết; promise (n./v.) lời hứa|make/take a pledge = đưa ra lời cam kết; pledge to do sth = cam kết làm gì|Every student had to sign a pledge not to cheat.|Mỗi học sinh phải ký cam kết không gian lận.|On Vesak day, many people make a pledge to keep the five precepts.|Vào ngày Phật đản, nhiều người phát nguyện giữ năm giới.|Vừa là danh từ vừa là động từ: make a pledge / pledge to do sth. Gần nghĩa: promise, vow (lời nguyện).", "gradual|gradually (adv.) dần dần; grade (n.) bậc, cấp|a gradual change/improvement = sự thay đổi/cải thiện dần dần; the gradual path = con đường tiệm tu|The change in the weather was gradual.|Thời tiết thay đổi từ từ.|Some schools teach a gradual path to awakening, others a sudden one.|Có tông phái dạy con đường tiệm tu, có tông phái dạy đốn ngộ.|Gốc Latin gradus là bậc thang (như grade, graduate): đi lên từng bậc nên thành \"dần dần\". Đốn ngộ là sudden; tiệm tu là gradual.", "lectures|lecture (n./v.) bài giảng; giảng; lecturer (n.) giảng viên|give/attend lectures = giảng bài/dự giảng; lecture hall = giảng đường; lecture sb about sth = lên lớp ai|She records the lectures so she can listen to them again later.|Cô ghi âm các bài giảng để nghe lại sau.|Thich Nhat Hanh gave lectures on mindfulness all over the world.|Thiền sư Thích Nhất Hạnh đã giảng về chánh niệm khắp thế giới.|lecture còn là động từ \"lên lớp, giáo huấn\" (Stop lecturing me!). Giảng viên là lecturer.", "progress|progressive (adj.) tiến bộ, cấp tiến; progression (n.) sự tiến triển|make progress = tiến bộ; in progress = đang diễn ra; slow progress = tiến bộ chậm|The meeting is in progress, please wait outside.|Cuộc họp đang diễn ra, vui lòng chờ bên ngoài.|Do not worry about fast progress in meditation; just keep practising.|Đừng lo về việc tiến bộ nhanh trong thiền; chỉ cần tiếp tục thực hành.|Danh từ không đếm được: make progress (không nói \"a progress\"). Động từ nhấn âm sau: /prəˈɡres/.", "effectively|effect (n.) tác dụng; effective (adj.) hiệu quả; effectiveness (n.) tính hiệu quả|work/communicate effectively = làm việc/giao tiếp hiệu quả; use time effectively = dùng thời gian hiệu quả|This medicine works effectively against headaches.|Thuốc này có tác dụng hiệu quả với chứng đau đầu.|To meditate effectively, find a quiet place and a regular time.|Để thiền hiệu quả, hãy tìm một nơi yên tĩnh và một giờ giấc đều đặn.|Phân biệt: effectively (hiệu quả) và efficiently (không lãng phí). Đừng nhầm effect (n.) với affect (v.).", "prostrations|prostrate (v./adj.) phủ phục; prostration (n.) sự lễ lạy (số ít)|do/perform prostrations = lễ lạy; full prostrations = đại lễ lusion.|Một vị A-la-hán đã nhổ tận gốc hoàn toàn tham, sân, si.|Đồng nghĩa: totally, entirely, absolutely. \"Completely\" hay đi với different, new, wrong.", "extreme|extremely (adv.) cực kỳ; extremist (n.) kẻ cực đoan; extremism (n.) chủ nghĩa cực đoan|extreme weather = thời tiết cực đoan; extreme sports = thể thao mạo hiểm; go to extremes = đi đến cực đoan|Extreme sports like skydiving are not for everyone.|Các môn thể thao mạo hiểm như nhảy dù không dành cho tất cả mọi người.|The Middle Way avoids both extreme pleasure and extreme hardship.|Trung đạo tránh cả cực đoan hưởng lạc lẫn cực đoan khổ hạnh.|Trạng từ extremely rất thông dụng: extremely difficult. Trung đạo là tránh hai cực đoan (two extremes).", "obedience|obey (v.) vâng lời; obedient (adj.) ngoan ngoãn; disobey (v.) không vâng lời; disobedience (n.) sự bất tuân|blind obedience = sự vâng lời mù quáng; obedience to the law = tuân thủ pháp luật|The army demands total obedience from its soldiers.|Quân đội đòi hỏi binh sĩ tuyệt đối phục tùng.|Buddhism values understanding more than blind obedience.|Đạo Phật coi trọng sự hiểu biết hơn sự vâng lời mù quáng.|obey → obedient → obedience. Chú ý chính tả biến đổi: obEY thành obEDIence.", "obey|obedience (n.) sự vâng lời; obedient (adj.) ngoan ngoãn; disobey (v.) không vâng lời|obey the law/rules/orders = tuân thủ luật/quy định/mệnh lệnh; obey your parents = vâng lời cha mẹ|Children should obey their parents, but parents should also listen to their children.|Con cái nên vâng lời cha mẹ, nhưng cha mẹ cũng nên lắng nghe con.|Novices must obey the rules of the monastery.|Các chú tiểu phải tuân thủ nội quy của tu viện.|Không có giới từ sau obey: obey the rules (KHÔNG nói \"obey to\"). Trái nghĩa: disobey.", "inner|inside (n./adv.) bên trong; innermost (adj.) sâu kín nhất; outer (adj.) bên ngoài|inner peace = bình an nội tâm; inner city = nội thành; inner strength = sức mạnh nội tâm|She lives in the inner city, close to her office.|Cô ấy sống ở nội thành, gần chỗ làm.|I s a big boost to his ego.|Thắng giải là cú hích lớn cho cái tôi của anh ấy.|The more we cling to our ego, the more easily we are hurt.|Càng bám chấp vào bản ngã, ta càng dễ bị tổn thương.|Tiếng Latin ego là \"tôi\". Đọc /ˈiː.ɡəʊ/. Liên quan đến giáo lý vô ngã (selflessness).", "lessens|less (adj./adv.) ít hơn; lessen (v.) làm giảm bớt; lesser (adj.) kém hơn|lessens the pain/risk/impact = làm giảm đau/rủi ro/tác động|Wearing a seatbelt lessens the risk of serious injury.|Thắt dây an toàn làm giảm nguy cơ chấn thương nặng.|Understanding impermanence lessens our fear of change.|Hiểu vô thường làm vơi bớt nỗi sợ thay đổi.|less + -en (làm cho) thành lessen. Đọc /ˈles.ən/ giống \"lesson\" (bài học): đồng âm khác nghĩa!", "increases|increase (v./n.) tăng; sự tăng; increasing (adj.) ngày càng tăng; increasingly (adv.) ngày càng|increases steadily/sharply = tăng đều/tăng mạnh; an increase in = sự tăng lên về|The risk of heart disease increases with age.|Nguy cơ bệnh tim tăng theo tuổi tác.|When generosity increases, greed naturally becomes weaker.|Khi lòng rộng lượng tăng lên, lòng tham tự nhiên yếu đi.|Động từ nhấn âm sau /ɪnˈkriːs/, danh từ nhấn âm đầu /ˈɪŋ.kriːs/. Trái nghĩa: decrease.", "happiness|happy (adj.) hạnh phúc; happily (adv.) vui vẻ; unhappiness (n.) nỗi bất hạnh|true happiness = hạnh phúc đích thực; the pursuit of happiness = sự mưu cầu hạnh phúc|The Declaration of Independence speaks of life, liberty and the pursuit of happiness.|Bản Tuyên ngôn Độc lập nói về quyền sống, quyền tự do và quyền mưu cầu hạnh phúc.|Thich Nhat Hanh taught that there is no way to happiness: happiness is the way.|Thiền sư Thích Nhất Hạnh dạy: không có con đường nào dẫn đến hạnh phúc, hạnh phúc chính là con đường.|happy + -ness (y đổi thành i). Nhớ câu Tuyên ngôn Độc lập: \"life, liberty and the pursuit of happiness\".", "generated|generate (v.) tạo ra; generator (n.) máy phát điện; generation (n.) thế hệ|generated electricity/income = điện/thu nhập được tạo ra; computer-generated = d const KEY='hoasen-v1', DAY=864e5, MIN=6e4;
const DEF={newPerDay:10,accent:'en-GB',rate:0.9,autoplay:true,autoEx:false,sfx:true,order:'list',speakQ:false,src:'learned',
  hf:{vi:true,ex:true,exvi:false,rep:false,gap:'mid',loop:true,shuffle:false}};
const H0={n:0,pass:0,rv:0,nw:0,ms:0,pr:0};
function fresh(){return {v:2,cards:{},settings:JSON.parse(JSON.stringify(DEF)),day:{d:-1,newDone:0,revDone:0,extra:0},hist:{},prio:[],seed:Math.floor(Math.random()*1e9),updatedAt:0}}
function migrate(o){const f=fresh();o=(o&&typeof o==='object')?o:{};const os=o.settings||{};
  const st={...f.settings,...os,hf:{...f.settings.hf,...(os.hf||{})}};const hist={};
  for(const k in (o.hist||{})){const h=o.hist[k];hist[k]=typeof h==='number'?{...H0,n:h}:{...H0,...h}}
  return {...f,...o,v:2,cards:o.cards||{},settings:st,day:{...f.day,...(o.day||{})},hist,prio:o.prio||[]}}
function load(){try{const t=localStorage.getItem(KEY);if(t)return migrate(JSON.parse(t))}catch(e){}return fresh()}
let S=load();
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}schedulePush()}
function dayNum(t){const d=new Date(t-4*3600e3);return Math.floor((d.getTime()-d.getTimezoneOffset()*MIN)/DAY)}
function ensureDay(){const t=dayNum(Date.now());if(S.day.d!==t){S.day={d:t,newDone:0,revDone:0,extra:0}}
  for(const k in S.hist){if(+k<t-400)delete S.hist[k]}}
function hday(){ensureDay();return S.hist[S.day.d]||(S.hist[S.day.d]={...H0})}
function logAnswer(kind,pass,ms){const h=hday();h.n++;if(kind==='new')h.nw++;if(kind==='rev'){h.rv++;if(pass)h.pass++}h.ms+=ms}
function logPractice(ms){const h=hday();h.pr++;h.ms+=ms}

/* ---------- spaced repetition (SM-2 style, Anki-like steps) ---------- */
const STEPS=[1,10], RELEARN=10;
function newCard(){return {s:'n',due:0,ivl:0,ef:2.5,step:0,reps:0,lapses:0}}
function fuzz(ivl,noFuzz){if(noFuzz||ivl<3)return ivl;const f=Math.max(1,Math.round(ivl*0.05));return ivl+Math.round((Math.random()*2-1)*f)}
function schedule(prev,r,now,noFuzz){
  const c={...prev};c.reps=(c.reps||0)+1;c.last=now;
  if(c.s==='n'||c.s==='l'){
    if(r===1){c.s='l';c.step=0;c.due=now+STEPS[0]*MIN}
    else if(r===2){c.s='l';c.due=now+(c.step===0?(STEPS[0]+STEPS[1])/2:STEPS[c.step]*1.5)*MIN}
    else if(r===3){const n=(c.s==='n'?0:c.step)+1;if(n>=STEPS.length){c.s='r';c.ivl=1;c.due=now+DAY}else{c.s='l';c.step=n;c.due=now+STEPS[n]*MIN}}
    else{c.s='r';c.ivl=4;c.due=now+4*DAY}
    return c}
  if(c.s==='rl'){
    if(r===1){c.due=now+RELEARN*MIN}
    else if(r===2){c.due=now+15*MIN}
    else{c.s='r';c.due=now+c.ivl*DAY}
    return c}

const STARTERS=new Set('the a an this that these those my your his her our their its it we you they he she in on at for with after before when if every each many some most all no nothing despite even one to by through under according children people anyone everyone what why how do does is are was were be can could should would will may must there here please small young old good true real just only lay some'.split(' '));
function scrTokens(en){const t=en.split(/\s+/).filter(Boolean);let suffix='';const last=t[t.length-1];const m=last.match(/^(.*?)([.!?]+["”’]?)$/);if(m&&m[1]){t[t.length-1]=m[1];suffix=m[2]}return {t,suffix}}

   <section class="card prose"><h3 style="margin-bottom:6px">Dự kiến</h3><p>${proj}</p><p class="muted small" style="margin:0">Hiện có ${st.mature} từ thuộc lòng (khoảng cách ôn từ 21 ngày trở lên) và ${st.young} từ đang nhớ.</p></section>
   <section class="card"><h3 style="margin-bottom:4px">Từ hay quên nhất</h3>${hard.length?`<div class="hard-list">${hard.map(w=>`<button data-act="detail" data-w="${esc(w)}"><span><b>${esc(w)}</b> <span class="muted small">${esc(BY[w].vi)}</span></span><span class="muted small">quên ${S.cards[w].lapses} lần</span></button>`).join('')}</div>
     <button class="btn ghost sm" style="margin-top:8px" data-act="hardPractice">Ôn nhanh nhóm từ hay quên</button>`:'<p class="muted" style="margin:0">Chưa có từ nào bị quên. Tuyệt vời!</p>'}</section>
  </div>`}

/* ---------- words ---------- */
function renderWords(){const q=wordsFilter.q.trim().toLowerCase();
  let list=W;if(wordsFilter.lesson!=null)list=list.slice(wordsFilter.lesson*LESSON,wordsFilter.lesson*LESSON+LESSON);
  if(wordsFilter.st!=='all')list=list.filter(x=>{const s=stateOf(S.cards[x.w]);return wordsFilter.st==='known'?(s==='young'||s==='mature'):s===wordsFilter.st});
  if(q)list=list.filter(x=>x.w.toLowerCase().includes(q)||x.vi.toLowerCase().includes(q)||x.col.some(c=>c.en.toLowerCase().includes(q)));
  const chips=[['all','Tất cả'],['new','Chưa học'],['learn','Đang học'],['known','Đã nhớ']];
  const now=Date.now();
  main.innerHTML=`<div class="stack">
  <input class="search" id="wq" type="search" placeholder="Tìm từ, nghĩa tiếng Việt hoặc cụm từ…" value="${esc(wordsFilter.q)}" aria-label="Tìm từ">
  <div class="chips">${chips.map(([k,l])=>`<button data-act="wfilter" data-k="${k}" aria-pressed="${wordsFilter.st===k}">${l}</button>`).join('')}
    ${wordsFilter.lesson!=null?`<button data-act="wlesson" aria-pressed="true">Bài ${wordsFilter.lesson+1} ✕</button>`:''}</div>
  <div class="muted" style="font-size:13px">${list.length} từ</div>
  <div class="wlist">${list.map(x=>{const c=S.cards[x.w],s=stateOf(c);const nxt=c&&c.s!=='n'?(c.due<=now?'đến hạn':fmtDelta(c.due-now)):'';
    return `<button class="wrow" data-act="detail" data-w="${esc(x.w)}"><span class="em">${x.emo[0]||''}</span><span style="min-width:0"><div class="w">${esc(x.w)}</div><div class="m">${esc(x.vi)}</div></span><span class="st">${nxt}<span class="dot" style="background:${STATE_COL[s]};${s==='new'?'border:1px solid var(--line)':''}" title="${STATE_LBL[s]}"></span></span></button>`}).join('')||'<p class="muted" style="padding:14px;margin:0">Không tìm thấy từ phù hợp.</p>'}</div></div>`;
  const inp=$('#wq');inp.addEventListener('input',e=>{wordsFilter.q=e.target.value;const pos=e.target.selectionStart;renderWords();const n=$('#wq');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}})}
function openDetail(w){const x=BY[w],c=S.cards[w],s=stateOf(c),now=Date.now();
  const info=c&&c.s!=='n'?`${STATE_LBL[s]} · ôn tiếp ${c.due<=now?'ngay bây giờ':'sau '+fmtDelta(c.due-now)} · đã ôn ${c.reps||0} lần${c.lapses?`, quên ${c.lapses} lần`:''}`:'Chưa học';
  $('#sheet').innerHTML=`<div class="sheet-bg" data-act="closeSheet"><div class="sheet gut" role="dialog" aria-label="${esc(w)}"><div class="grab"></div><div class="qwrap">${fullInfo(x,{all:true})}
    <div class="muted" style="font-size:13px">${info}</div>
    <div class="row" style="width:100%">${!c||c.s==='n'?`<button class="btn primary" style="flex:1" data-act="prio" data-w="${esc(w)}">Học từ này tiếp theo</button>`:`<button class="btn ghost" style="flex:1" data-act="resetWord" data-w="${esc(w)}">Học lại từ đầu</button>`}
    <button class="btn ghost" style="flex:1" data-act="closeSheet">Đóng</button></div></div></div></div>`;
  $('#sheet .sheet').scrollTop=0;if(S.settings.autoplay)say(x.w)}

/* ---------- settings ---------- */
let resetArm=0;
function renderSettings(){const st=S.settings;
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-act="setv" data-k="${key}" data-v="${v}" aria-pressed="${String(st[key])===String(v)}">${l}</button>`).join('')}</div>`;
  main.innerHTML=`<div class="stack">
  <section class="card"><h2 style="margin-bottom:4px">Học tập</h2>
    <div class="set"><label>Từ mới mỗi ngày<div class="sub">Ôn tập luôn được ưu tiên trước</div></label>${seg('newPerDay',[[5,'5'],[10,'10'],[15,'15'],[20,'20']])}</div>
    <div class="set"><label>Thứ tự từ mới</label>${seg('order',[['list','Theo danh sách'],['random','Ngẫu nhiên']])}</div>
    ${CAN_LISTEN?`<div class="set"><label for="sq">Thêm câu hỏi nói khi ôn<div class="sub">Nhìn nghĩa rồi nói từ tiếng Anh vào micro (với từ đã nhớ khá chắc)</div></label><input class="switch" type="checkbox" id="sq" ${st.speakQ?'checked':''}></div>`:''}
  </section>
  <section class="card"><h2 style="margin-bottom:4px">Âm thanh</h2>
    <div class="set"><label>Giọng đọc</label>${seg('accent',[['en-GB','Anh-Anh'],['en-US','Anh-Mỹ']])}</div>
    <div class="set"><label for="rate">Tốc độ đọc<div class="sub" id="rateV">${st.rate.toFixed(2).replace('.',',')}×</div></label><input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="${st.rate}"></div>
    <div class="set"><label for="ap">Tự động phát âm từ</label><input class="switch" type="checkbox" id="ap" ${st.autoplay?'checked':''}></div>
    <div class="set"><label for="ae">Tự đọc câu ví dụ khi xem đáp án</label><input class="switch" type="checkbox" id="ae" ${st.autoEx?'checked':''}></div>
    <div class="set"><label for="sf">Hiệu ứng âm thanh</label><input class="switch" type="checkbox" id="sf" ${st.sfx?'checked':''}></div>
    <div class="set"><label>Thử giọng</label><button class="btn ghost" data-act="testVoice">Nghe thử</button></div>
  </section>
  <section class="card"><h2 style="margin-bottom:4px">Dữ liệu</h2>
    <div class="set"><label>Lưu tiến độ<div class="sub" id="syncTxt">${syncLabel()}</div></label></div>
    <div class="set" style="flex-direction:column;align-items:stretch"><label>Sao lưu / khôi phục<div class="sub">Sao chép mã này để chuyển tiến độ sang máy khác (dùng được cho cả app và bản web), hoặc dán mã vào rồi bấm Khôi phục.</div></label>
      <textarea id="bk" spellcheck="false" aria-label="Mã sao lưu"></textarea>
      <div class="row" style="justify-content:flex-start"><button class="btn ghost" data-act="exportBk">Tạo mã & sao chép</button><button class="btn ghost" data-act="importBk">Khôi phục</button></div></div>
    <div class="set"><label>Xoá toàn bộ tiến độ</label><button class="btn ghost" style="color:var(--again)" data-act="reset">${resetArm>Date.now()?'Bấm lần nữa để xoá':'Xoá'}</button></div>
  </section>
  ${IS_APP?`<section class="card prose"><h2 style="margin-bottom:8px">Không nghe thấy phát âm?</h2>
    <p>App dùng giọng đọc của điện thoại. Hãy chọn công cụ <b>Dịch vụ lời nói của Google</b>, tải giọng tiếng Anh (và tiếng Việt nếu muốn nghe nghĩa), rồi mở lại app.</p>
    <button class="btn ghost" data-act="ttsSettings">Mở cài đặt giọng đọc</button></section>`
  :`<section class="card prose"><h2 style="margin-bottom:8px">Cài như ứng dụng trên Android</h2>
    <ol><li>Mở trang này bằng Chrome trên điện thoại.</li><li>Chạm menu ⋮ ở góc trên bên phải.</li><li>Chọn <b>Thêm vào màn hình chính</b> rồi <b>Thêm</b>.</li></ol>
    <p class="muted" style="margin-top:8px;font-size:13.5px">Phát âm dùng giọng đọc có sẵn của điện thoại. Nếu không nghe thấy, vào Cài đặt Android → Ngôn ngữ → Đầu ra chuyển văn bản thành giọng nói, chọn Google và tải giọng tiếng Anh.</p></section>`}
  <section class="card prose"><h2 style="margin-bottom:8px">Cách app lên lịch ôn</h2>
    <p>Mỗi từ mới được hỏi lại sau 1 phút và 10 phút. Khi đã nhớ, khoảng cách giãn dần: 1 ngày, khoảng 3 ngày, 1 tuần, rồi vài tuần. Chấm <b>Lại</b> khi quên, từ đó sẽ quay về và khoảng cách rút ngắn.</p>
    <p class="muted" style="margin:0;font-size:13.5px">Dạng câu hỏi đổi theo mức độ nhớ: xem từ, nghe đoán, chọn nghĩa, nhìn hình đoán từ, điền vào câu, nghe viết chính tả và xếp lại câu. Mỗi lần ôn, app xoay sang một câu ví dụ khác trong ba câu của từ đó.</p></section>
  </div>`;
  $('#rate').addEventListener('input',e=>{S.settings.rate=+e.target.value;$('#rateV').textContent=S.settings.rate.toFixed(2).replace('.',',')+'×'});
  $('#rate').addEventListener('change',()=>{save();say('Compassion and wisdom')});
  [['ap','autoplay'],['ae','autoEx'],['sf','sfx'],['sq','speakQ']].forEach(([id,k])=>{const el=$('#'+id);if(el)el.addEventListener('change',e=>{S.settings[k]=e.target.checked;save()})})}

/* ---------- cloud sync (web version only, per-person, private) ---------- */
const cloud={ref:null,status:'local'};
function syncLabel(){return {local:'Lưu trên thiết bị này',cloud:'Đồng bộ với tài khoản Claude của bạn',error:'Lỗi đồng bộ, vẫn lưu trên thiết bị'}[cloud.status]}
function setSync(s){cloud.status=s;const t=$('#syncTxt');if(t)t.textContent=syncLabel()}
async function initCloud(tries=0){
  if(!window.claude||!window.claude.use){if(tries<3)setTimeout(()=>initCloud(tries+1),1200);return}
  try{const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
    const id=await user.id();if(!id)return;cloud.ref=db.doc('data/users/'+id+'/srs');
    const snap=await cloud.ref.get();const d=snap.exists?snap.data():null;
    if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){S=migrate(JSON.parse(d.json));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!sess.active)render();toast('Đã tải tiến độ từ tài khoản')}
    else if(S.updatedAt&&(!d||(d.updatedAt||0)<S.updatedAt))await pushCloud();
    setSync('cloud')}catch(e){setSync('local')}}
let pushT=null,pushing=false,again=false;
function schedulePush(){if(!cloud.ref)return;clearTimeout(pushT);pushT=setTimeout(pushCloud,3000)}
async function pushCloud(){if(!cloud.ref)return;clearTimeout(pushT);if(pushing){again=true;return}pushing=true;
  try{await cloud.ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt});setSync('cloud')}catch(e){setSync('error')}
  pushing=false;if(again){again=false;pushCloud()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&pushT)pushCloud();if(document.visibilityState==='visible'&&!sess.active&&!(tab==='practice'&&sub==='listen'))render()});

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){$('#sheet').innerHTML='';setTab(t.dataset.tab);return}
  const a=t.dataset.act,w=t.dataset.w;
  if(a==='closeSheet'){if(e.target===t||t.tagName==='BUTTON')$('#sheet').innerHTML='';return}
  switch(a){
    case 'start':startSession('srs');break;
    case 'extra':ensureDay();S.day.extra=(S.day.extra||0)+5;save();startSession('srs');break;
    case 'pStart':startSession(t.dataset.k);break;
    case 'again':{const k=sess.kind;startSession(k);break}
    case 'quit':quit();break;
    case 'home':quit();break;
    case 'toPractice':quit();break;
    case 'say':say(w);break;
    case 'saySlow':say(w,0.6);break;
    case 'sayEx':say(W[+t.dataset.i].exs[+t.dataset.k].en);break;
    case 'sayRaw':say(t.dataset.t);break;
    case 'exTab':{const x=W[+t.dataset.i],k=+t.dataset.k,el=t.closest('.example');if(el)el.outerHTML=exHTML(x,k,{id:el.id});if(sess.active&&sess.cur===x.w)sess.exk=k;break}
    case 'mic':doMic(+t.dataset.i,t.dataset.part);break;
    case 'reveal':sfx('tap');reveal();break;
    case 'hint':sess.hint=true;render();break;
    case 'rate':rate(+t.dataset.r);break;
    case 'choose':{const ok=w===sess.cur;sess.result=ok;if(sess.kind!=='srs'&&ok)sess.right++;sfx(ok?'ok':'bad');
      document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.w===sess.cur)b.classList.add('ok');else if(b===t)b.classList.add('bad')});
      setTimeout(reveal,ok?650:1100);break}
    case 'pnext':practiceNext();break;
    case 'scrPick':{const s=sess.scr;s.chosen.push(s.pool.splice(+t.dataset.p,1)[0]);sfx('tap');render();break}
    case 'scrBack':{const s=sess.scr;s.pool.push(s.chosen.splice(+t.dataset.c,1)[0]);render();break}
    case 'scrClear':{const s=sess.scr;s.pool=s.pool.concat(s.chosen);s.chosen=[];render();break}
    case 'scrCheck':{const s=sess.scr;s.ok=s.chosen.map(i=>s.t[i].toLowerCase()).join(' ')===s.t.map(x=>x.toLowerCase()).join(' ');s.checked=true;sess.result=s.ok;
      if(sess.kind!=='srs'&&s.ok)sess.right++;sfx(s.ok?'ok':'bad');render();say(BY[sess.cur].exs[s.k].en,S.settings.rate*0.95);break}
    case 'scrNext':if(sess.kind==='srs')reveal();else practiceNext();break;
    case 'spNext':if(sess.sp.w)sess.right++;if(sess.sp.e!=null){sess.exSum+=sess.sp.e;sess.exCnt++}practiceNext();break;
    case 'lesson':wordsFilter={q:'',st:'all',lesson:+t.dataset.l};setTab('words');break;
    case 'wfilter':wordsFilter.st=t.dataset.k;renderWords();break;
    case 'wlesson':wordsFilter.lesson=null;renderWords();break;
    case 'detail':openDetail(w);break;
    case 'prio':S.prio=[w,...S.prio.filter(p=>p!==w)];ensureDay();if(newLeft()===0)S.day.extra=(S.day.extra||0)+1;save();$('#sheet').innerHTML='';toast('“'+w+'” sẽ xuất hiện ở lượt học tới');if(!sess.active)render();break;
    case 'resetWord':delete S.cards[w];save();$('#sheet').innerHTML='';toast('Đã đặt lại “'+w+'”');if(!sess.active)render();break;
    case 'hfOpen':hfOpen();break;
    case 'hfToggle':if(HF.playing)hfStop();else hfPlay(HF.idx);break;
    case 'hfPrev':{const i=Math.max(0,HF.idx-1);if(HF.playing)hfPlay(i);else{HF.idx=i;hfRender()}break}
    case 'hfNext':{const i=Math.min(HF.list.length-1,HF.idx+1);if(HF.playing)hfPlay(i);else{HF.idx=i;hfRender()}break}
    case 'hfGap':S.settings.hf.gap=t.dataset.v;save();t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));if(HF.playing)hfPlay(HF.idx);break;
    case 'pBack':if(HF.playing)hfStop();sub='main';render();main.scrollTop=0;break;
    case 'roots':sub='roots';render();main.scrollTop=0;break;
    case 'affixPractice':S.settings.src='affix:'+t.dataset.a;save();startSession('quiz');break;
    case 'hardPractice':S.settings.src='hard';save();startSession('quiz');break;
    case 'hm':{const d=+t.dataset.d,h=S.hist[d];const el=$('#hmInfo');if(el)el.textContent=`${fmtDay(d,true)}: ${h?h.n:0} lượt ôn${h&&h.pr?`, ${h.pr} lượt luyện tập`:''}${h&&h.ms?`, ${Math.round(h.ms/MIN)} phút`:''}`;break}
    case 'setv':{const k=t.dataset.k;let v=t.dataset.v;if(k==='newPerDay')v=+v;S.settings[k]=v;save();renderSettings();if(k==='accent')say('Welcome to your daily practice');break}
    case 'ttsSettings':try{window.Android.openTtsSettings()}catch(err){}break;
    case 'testVoice':say('The Buddha attained enlightenment under the Bodhi tree.');break;
    case 'exportBk':{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=$('#bk');ta.value=code;
      const fallback=()=>{ta.focus();ta.select();toast('Đã tạo mã. Hãy chọn và sao chép thủ công.')};
      if(IS_APP){try{window.Android.copy(code);toast('Đã sao chép mã sao lưu')}catch(err){fallback()}break}
      try{navigator.clipboard.writeText(code).then(()=>toast('Đã sao chép mã sao lưu'),fallback)}catch(err){fallback()}break}
    case 'importBk':{const v=$('#bk').value.trim();if(!v){toast('Hãy dán mã sao lưu vào ô trước');break}
      try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o||!o.cards)throw 0;S=migrate(o);save();pushCloud();toast('Đã khôi phục tiến độ');renderSettings()}catch(err){toast('Mã không hợp lệ. Hãy kiểm tra lại đoạn đã dán.')}break}
    case 'reset':if(resetArm>Date.now()){const keep=S.settings;S=fresh();S.settings=keep;save();pushCloud();resetArm=0;toast('Đã xoá tiến độ');renderSettings()}else{resetArm=Date.now()+4000;renderSettings();setTimeout(()=>{if(tab==='settings')renderSettings()},4100)}break;
  }});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-act="spellForm"]');if(!f)return;e.preventDefault();
  const inp=$('#spellIn');const norm=s=>s.toLowerCase().trim().replace(/\s+/g,' ').replace(/[‐‑–]/g,'-');const typed=inp.value;if(!typed.trim()){inp.focus();return}
  const ok=norm(typed)===norm(sess.cur);sess.result=ok;sess.typed=ok?'':typed;sfx(ok?'ok':'bad');inp.classList.add(ok?'ok':'bad');inp.disabled=true;setTimeout(reveal,ok?600:900)});
document.addEventListener('keydown',e=>{if(tab!=='study'||!sess.active||!sess.cur||e.target.tagName==='INPUT')return;
  if(!sess.revealed&&(e.key===' '||e.key==='Enter')&&['word','listen','picture','cloze'].includes(sess.mode)){e.preventDefault();reveal();return}
  if((sess.revealed||sess.mode==='intro')&&sess.kind==='srs'&&/^[1-4]$/.test(e.key)){const r=+e.key;if(sess.mode==='intro'&&!sess.revealed&&r===2)return;rate(r)}});

/* Android Back button: close the sheet, leave the session or sub-view, then go home; returning false lets the app close. */
window.appBack=function(){if($('#sheet').innerHTML){$('#sheet').innerHTML='';return true}
  if(sess.active){quit();return true}
  if(tab==='practice'&&sub!=='main'){if(HF.playing)hfStop();sub='main';render();return true}
  if(tab!=='home'){setTab('home');return true}return false};

setTab('home');
if(!IS_APP)initCloud();
</script>
