name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HoaSenTuVung.apk

      - name: Upload APK (tab Actions)
        uses: actions/upload-artifact@v4
        with:
          name: HoaSenTuVung-apk
          path: out/HoaSenTuVung.apk

      - name: Publish to Releases (tải thẳng trên điện thoại)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hoa Sen Từ Vựng – bản ${{ github.run_number }}
          files: out/HoaSenTuVung.apk
